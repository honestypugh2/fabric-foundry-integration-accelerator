    <text x="72" y="206" fill="#f3f7fd" font-size="64" font-weight="700">Fabric + Foundry</text>
    <text x="72" y="279" fill="#f3f7fd" font-size="60" font-weight="700">Integration Accelerator</text>
    <text x="74" y="332" fill="#c5d3e4" font-size="23">Two use cases. Synthetic data. A practical place to start.</text>
    <g transform="translate(72 388)">
      <rect width="368" height="138" rx="18" fill="#172f43" stroke="#3b6270"/>
