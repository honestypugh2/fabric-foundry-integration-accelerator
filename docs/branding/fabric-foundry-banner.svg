<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Fabric + Foundry Integration Accelerator</title>
  <desc id="description">Show and tell. Build and learn. Fabric provides governed context, Foundry supports reasoning and action, and GitHub Copilot helps build and verify. Original repository branding with no product logos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10283d"/>
      <stop offset="1" stop-color="#101729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ce6c5"/>
      <stop offset="1" stop-color="#85b6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <path d="M1030 0v640M1130 0v640M1230 0v640M0 120h1280M0 220h1280M0 320h1280M0 420h1280M0 520h1280" stroke="#a7caec" stroke-opacity=".035"/>
  <circle cx="1140" cy="130" r="180" fill="#2b6495" fill-opacity=".09"/>
  <circle cx="1200" cy="580" r="240" fill="#48ad96" fill-opacity=".06"/>
  <rect x="72" y="68" width="54" height="5" rx="2.5" fill="url(#accent)"/>
