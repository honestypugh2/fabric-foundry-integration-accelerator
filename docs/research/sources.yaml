# Authoritative source registry. Edit this file, then run `uv run ffia sources render`.
# Status vocabulary: GA | PREVIEW | DEPRECATED | UNKNOWN/NEEDS VALIDATION | GUIDANCE | OSS
version: 1
sources:
  - id: github-codeql-configuration
    title: Workflow configuration options for code scanning
    url: https://docs.github.com/en/code-security/reference/code-scanning/workflow-configuration-options
    publisher: GitHub Docs
    retrieved_date: 2026-10-09
    technology: GitHub CodeQL
    associated_patterns: [P08, P09]
    status: GUIDANCE
    key_architecture_statement: Advanced code scanning workflows support push, pull request and scheduled analysis with language-specific configuration.
    implementation_relevance: Two-language CodeQL workflow complements deterministic offline quality and evaluation release gates.
    security_implications: Scope security-events write to analysis jobs and protect publication through reviewed release artifacts.
    limitations: Workflow configuration is not evidence of a completed scan or zero alerts; repository code-scanning availability and branch protections need operator verification.
    fallback: Local lint, strict types, tests, dependency audits and privacy scan; not equivalent to CodeQL.
  # ------------------------------------------------------------------ Fabric foundation
  - id: fabric-overview
    title: What is Microsoft Fabric?
    url: https://learn.microsoft.com/fabric/fundamentals/microsoft-fabric-overview
    publisher: Microsoft Learn
    retrieved_date: 2026-10-05
    last_updated_date: 2026-03-18
    technology: Microsoft Fabric
    associated_patterns: [P06, P10]
    status: GA
    key_architecture_statement: SaaS analytics platform for end-to-end data workflows that uses OneLake as a single logical data lake.
    implementation_relevance: Fabric is the governed-context layer of the reference architecture.
    security_implications: Tenant, capacity, workspace and item boundaries drive authorization; Entra ID authenticates all access.
    limitations: Requires a Fabric capacity for most workloads; features vary by region and SKU.
    fallback: Local Fabric Educational Provider (synthetic, clearly labeled SIMULATED).
  - id: fabric-medallion
    title: Implement medallion lakehouse architecture in Microsoft Fabric
    url: https://learn.microsoft.com/fabric/onelake/onelake-medallion-lakehouse-architecture
    publisher: Microsoft Learn
    retrieved_date: 2026-10-05
    last_updated_date: 2026-02-12
    technology: Microsoft Fabric
    associated_patterns: [P10]
    status: GUIDANCE
    key_architecture_statement: Medallion (bronze, silver, gold) is the recommended design approach for Fabric lakehouses.
    implementation_relevance: Defines the raw/bronze/silver/gold/semantic layering used by the synthetic dataset and labs.
    security_implications: Layer separation supports least-privilege access (e.g., analysts read gold only).
    limitations: Guidance, not an enforced product feature.
    fallback: Local medallion pipeline over Parquet/DuckDB.
  - id: fabric-waf
    title: Azure Well-Architected Framework service guide for Microsoft Fabric
    url: https://learn.microsoft.com/azure/well-architected/microsoft-fabric/overview
    publisher: Microsoft Learn (Well-Architected Framework)
    retrieved_date: 2026-10-05
    last_updated_date: 2026-05-13
    technology: Microsoft Fabric
    associated_patterns: [P06, P14]
    status: GUIDANCE
    key_architecture_statement: Pillar guidance (reliability, security, cost, operations, performance) for Fabric workloads.
    implementation_relevance: Production-readiness notes in every pattern map to these pillars.
    security_implications: Security pillar guidance on identity, network isolation and data protection.
    limitations: Guidance only.
    fallback: Not applicable.
  - id: fabric-deployment-patterns
    title: Microsoft Fabric deployment patterns
    url: https://learn.microsoft.com/azure/architecture/data-guide/technology-choices/fabric-deployment-patterns
    publisher: Azure Architecture Center
    retrieved_date: 2026-10-05
    last_updated_date: 2026-04-20
    technology: Microsoft Fabric
    associated_patterns: [P14, P18]
    status: GUIDANCE
    key_architecture_statement: Four-level hierarchy (tenant, capacity, workspace, item) determines isolation and governance choices.
    implementation_relevance: Drives environment separation (dev/test/prod workspaces) and customer overlay design.
    security_implications: Workspace-level isolation is the primary blast-radius control for agentic changes.
    limitations: Guidance only.
    fallback: Not applicable.
  - id: fabric-direct-lake
    title: Direct Lake overview
    url: https://learn.microsoft.com/fabric/fundamentals/direct-lake-overview
    publisher: Microsoft Learn
    retrieved_date: 2026-10-05
    last_updated_date: 2026-09-02
    technology: Microsoft Fabric
    associated_patterns: [P12]
    status: GA
    key_architecture_statement: Direct Lake on OneLake (no DirectQuery fallback, composite-capable) and Direct Lake on SQL analytics endpoint (DirectLakeBehavior controls fallback).
    implementation_relevance: Semantic model storage-mode comparison and role-playing dimension options in Pattern 12.
    security_implications: Direct Lake on SQL falls back to DirectQuery when SQL RLS/OLS/DDM is present; identity mode affects shortcut authorization.
    limitations: Adding multiple tables from the same source table is not supported through the standard UI.
    fallback: Local semantic YAML and PBIP/TMDL reference model.
  - id: fabric-open-mirroring-format
    title: Open mirroring landing zone requirements and format
    url: https://learn.microsoft.com/fabric/mirroring/open-mirroring-landing-zone-format
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    last_updated_date: 2026-02-03
    technology: Microsoft Fabric
    associated_patterns: [P11]
    status: GA
    key_architecture_statement: Landing zone uses _metadata.json keyColumns, 20-digit continuous file names and a trailing __rowMarker__ column (0 insert with no duplicate-key check, 1 update, 2 delete, 4 upsert); processed files are purged after 7 days.
    implementation_relevance: Local Open Mirroring simulation (ffia recovery run) reproduces this documented format and row-marker semantics.
    security_implications: Mirroring does not propagate source RLS/OLS/dynamic data masking.
    limitations: Schema changes require recreating the table folder; mirroring is not documented as a backup/DR mechanism.
    fallback: Local landing-zone simulation and recovery lab.
  - id: fabric-git-integration
    title: Fabric Git integration overview
    url: https://learn.microsoft.com/fabric/cicd/git-integration/intro-to-git-integration
    publisher: Microsoft Learn
    retrieved_date: 2026-10-05
    last_updated_date: 2026-09-01
    technology: Microsoft Fabric
    associated_patterns: [P11, P20]
    status: GA
    key_architecture_statement: Git stores item definitions and metadata, never table data; some item types remain preview.
    implementation_relevance: Basis for repo-first agentic change (Pattern 20) and the Git-versus-data-backup lesson.
    security_implications: From 2026-12-01 users without read-write item permission lose Git integration access.
    limitations: Cloud-hosted Azure DevOps/GitHub only; per-item-type support varies.
    fallback: Local fabric/workspace definitions and dry-run deployment plans.
  - id: fabric-rest-identity
    title: Fabric REST API identity support
    url: https://learn.microsoft.com/rest/api/fabric/articles/identity-support
    publisher: Microsoft Learn
    retrieved_date: 2026-10-05
    technology: Microsoft Fabric
    associated_patterns: [P06, P09]
    status: GA
    key_architecture_statement: Fabric REST APIs accept user, service principal and managed identity tokens, gated by tenant settings and per-API support.
    implementation_relevance: Live Fabric provider uses a thin typed httpx client over the GA REST API (no GA Python SDK exists).
    security_implications: Service-principal access requires an admin tenant switch; least-privilege workspace roles apply.
    limitations: Per-API identity support varies; long-running operations require polling.
    fallback: Local Fabric provider.
  - id: fabric-notebook-definition
    title: Notebook definition (Fabric REST API item definitions)
    url: https://learn.microsoft.com/rest/api/fabric/articles/item-management/definitions/notebook-definition
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    last_updated_date: 2025-07-02
    technology: Microsoft Fabric
    associated_patterns: [P10, P20]
    status: GA
    key_architecture_statement: Notebook definitions use the fabricGitSource (default) or ipynb format; a PySpark notebook is one notebook-content.py part plus an optional .platform part, each InlineBase64.
    implementation_relevance: Format of the committed reference notebooks under fabric/workspace/ and of the scoped writer's create-notebook request.
    security_implications: A definition is code that runs with the caller's Spark identity; only reviewed, committed definitions are published.
    limitations: The default lakehouse binding lives in notebook metadata; the reference notebooks leave it empty so no IDs are committed.
    fallback: Local rendering and a local Spark 3.5 run of the same notebook code.
  - id: fabric-create-lakehouse
    title: Items - Create Lakehouse (Fabric REST API)
    url: https://learn.microsoft.com/rest/api/fabric/lakehouse/items/create-lakehouse
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    last_updated_date: 2026-10-05
    technology: Microsoft Fabric
    associated_patterns: [P08, P20]
    status: GA
    key_architecture_statement: Creates a lakehouse in a workspace; supports long-running operations; requires a contributor workspace role and Lakehouse.ReadWrite.All or Item.ReadWrite.All.
    implementation_relevance: One of the two operations of the gated scoped writer (create_lakehouse), with live duplicate re-check and verification.
    security_implications: Contributor role is broader than the single operation; the accelerator narrows it with policy, approval and a bound dev workspace.
    limitations: Display names must be unique per workspace and type; 202 responses must be polled.
    fallback: LOCAL simulated change flow; LIVE requests are refused, never redirected, without a writer.
  - id: fabric-lakehouse-list-tables
    title: Tables - List Tables (Fabric REST API, Lakehouse)
    url: https://learn.microsoft.com/rest/api/fabric/lakehouse/tables/list-tables
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    technology: Microsoft Fabric
    associated_patterns: [P10]
    status: PREVIEW
    key_architecture_statement: Lists lakehouse tables in a data array with continuationToken pagination; documented as preview and not recommended for production.
    implementation_relevance: Live provider's list_tables; row counts and columns are not part of the response.
    security_implications: Requires Lakehouse.Read.All or Lakehouse.ReadWrite.All.
    limitations: Preview API; schema-enabled lakehouses are not supported (use the Fabric MCP onelake_list-tables tool).
    fallback: Local lakehouse tables (LOCAL) in HYBRID mode.
  - id: fabric-admin-tenant-settings
    title: Tenants - List Tenant Settings (Fabric Admin REST API)
    url: https://learn.microsoft.com/rest/api/fabric/admin/tenants/list-tenant-settings
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    technology: Microsoft Fabric
    associated_patterns: [P09]
    status: GA
    key_architecture_statement: Returns tenant settings (settingName, title, enabled, security groups) in a value array with continuation; requires Tenant.Read.All and a Fabric administrator.
    implementation_relevance: ffia fabric readiness reads it to confirm the settings the labs rely on, matching by name or portal title.
    security_implications: Admin-only read; non-admins get a SKIPPED readiness check rather than a guess.
    limitations: Setting names are not published as a stable catalog; titles can change.
    fallback: Manual confirmation in the Fabric admin portal.
  - id: powerbi-execute-queries
    title: Datasets - Execute Queries In Group (Power BI REST API)
    url: https://learn.microsoft.com/rest/api/power-bi/datasets/execute-queries-in-group
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    last_updated_date: 2025-02-05
    technology: Power BI
    associated_patterns: [P10, P12]
    status: GA
    key_architecture_statement: Runs one DAX query per call against a semantic model; needs the Dataset Execute Queries REST API tenant setting and dataset read and build permissions.
    implementation_relevance: Live provider evaluates each governed measure with EVALUATE ROW to reconcile the live model with the baseline.
    security_implications: Respects the caller's permissions and row-level security; read-only.
    limitations: One query and one table per call; at most 100,000 rows or 1,000,000 values; models with live AAS connections unsupported.
    fallback: Local DuckDB measure evaluation (LOCAL).
  - id: fabric-runtime-1-3
    title: Runtime 1.3 in Fabric
    url: https://learn.microsoft.com/fabric/data-engineering/runtime-1-3
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    last_updated_date: 2026-09-18
    technology: Microsoft Fabric
    associated_patterns: [P10]
    status: GA
    key_architecture_statement: Runtime 1.3 runs Apache Spark 3.5, Java 11, Scala 2.12, Python 3.11 and Delta Lake 3.2.
    implementation_relevance: The reference notebooks are verified locally on Apache Spark 3.5.9 (Java 17), the same Spark line as Runtime 1.3.
    security_implications: Notebook code runs with the caller's identity on the workspace capacity.
    limitations: A local Spark run is LOCAL evidence only; Delta, OneLake paths and capacity behavior require tenant validation.
    fallback: Local DuckDB build of the same SQL.
  - id: fabric-trial
    title: Fabric trial capacity
    url: https://learn.microsoft.com/fabric/fundamentals/fabric-trial
    publisher: Microsoft Learn
    retrieved_date: 2026-10-07
    last_updated_date: 2026-09-29
    technology: Microsoft Fabric
    associated_patterns: [P10]
    status: GA
    key_architecture_statement: A Fabric trial capacity gives free access for 60 days to most Fabric workloads; it is started from the account manager in the Fabric portal.
    implementation_relevance: Fastest path to make a demo tenant ready for the live labs (see docs/operations/fabric-tenant-readiness.md).
    security_implications: Trial capacity is per user; assign a dedicated dev workspace to it.
    limitations: Time-limited; some features and regions differ from paid F SKUs.
    fallback: An F2+ capacity in an Azure subscription of the tenant.
  - id: fabric-ai-functions
    title: AI functions in Fabric
    url: https://learn.microsoft.com/fabric/data-science/ai-functions/overview
    publisher: Microsoft Learn
    retrieved_date: 2026-10-05
    last_updated_date: 2026-07-21
    technology: Microsoft Fabric
    associated_patterns: [P05]
    status: GA
    key_architecture_statement: ai.classify, ai.extract, ai.summarize and related functions run in pandas, PySpark, T-SQL and Dataflow Gen2, optionally using Foundry models.
