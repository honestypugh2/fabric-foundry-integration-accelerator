name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.14"

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Pyright (strict)
        run: pyright
      - name: Pytest with coverage (>= 85%)
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Source registry is rendered
        run: ffia sources check
      - name: Synthetic data matches the generator
        run: ffia data generate --check
      - name: JSON Schemas match the models
        run: ffia schemas check
      - name: Education content and completeness gate
        run: ffia education check
      - name: Architecture diagrams (draw.io and docs) are current
        run: ffia diagrams check
      - name: MCP profiles are pinned, least-privilege and current
        run: ffia mcp check
      - name: Fabric reference notebooks match the medallion SQL
        run: ffia notebooks check
      - name: Vendored skills are pinned, git-ignored and approval-gated
        run: ffia skills check
      - name: Offline demo release gate
        run: ffia demo check --no-azure-cli && ffia demo offline
      - name: Build distribution
        run: uv build

  frontend:
    name: frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install from lockfile
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build

  privacy:
    name: privacy leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
      - run: uv sync --frozen
      - name: Scan for customer identifiers, GUIDs, secrets and e-mail addresses
        env:
          # Optional plaintext terms supplied as a repository secret (newline-separated).
          FFIA_LEAK_DENYLIST: ${{ secrets.FFIA_LEAK_DENYLIST }}
        run: ffia privacy scan

  dependency-audit:
    name: dependency vulnerability audit (fails on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
      - run: uv sync --frozen
      - name: pip-audit (locked Python dependencies)
        run: |
          uv export --quiet --frozen --all-groups --no-emit-project --no-hashes -o requirements-audit.txt
          pip-audit -r requirements-audit.txt --no-deps --disable-pip --progress-spinner off
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: npm audit (HIGH/CRITICAL)
        working-directory: frontend
        run: npm audit --audit-level=high
