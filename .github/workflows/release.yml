name: release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  artifacts:
    needs: [quality, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FFIA_ENVIRONMENT: offline
      FFIA_FABRIC_LIVE: "0"
      FFIA_FOUNDRY_LIVE: "0"
      FFIA_APPLICATIONINSIGHTS_CONNECTION_STRING: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.14"
          activate-environment: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install from lockfiles
        run: uv sync --frozen && npm ci --prefix frontend
      - name: Build distributions and SBOMs
        run: make build sbom source-bundle-check
      - name: Package frontend and checksum artifacts
        run: |
          tar -czf dist/frontend.tar.gz -C frontend/dist .
          sha256sum dist/* sbom/*.json > release-SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffia-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/
            sbom/
            release-SHA256SUMS.txt
