name: Bug report
description: Report a defect. Use synthetic data only; never include real identifiers.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options: ["OFFLINE", "HYBRID", "LIVE", "Not applicable"]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
