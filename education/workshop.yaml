version: 1
title: "Build trustworthy data and agent workflows"
summary: "Understand the foundations. Build a bounded use case. Inspect the evidence. Learn why it works, where it fails and what production still requires."
execution_summary: "You can learn entirely offline, use the live-first application with disclosed read fallback, or require strict connected verification. Running the UI or a server on your computer does not mean its data operations are offline. The application uses Fabric REST and Foundry SDK; coding clients use the separately configured real Fabric MCP server."
execution_paths:
  - mode: OFFLINE
    title: Local / offline
    description: "Build and learn with synthetic data and deterministic providers without Azure access."
    results: "Reads are LOCAL; governed write rehearsals are SIMULATED. Offline does not mean an actual Fabric workspace was changed."
    fallback: "No live call is attempted, so there is no cloud fallback."
    prerequisites: [The repository's locked local dependencies and synthetic data.]
    commands: [ffia serve api --offline, ffia demo offline --json]
    safety: "No Azure credentials or active Fabric capacity are required. The offline demo must report zero cloud operations."
  - mode: HYBRID
    title: Azure / Fabric live-first
    description: "The default application tries eligible live reads first and keeps learning usable through explicitly permitted local read fallback."
    results: "Each operation reports LIVE, PREVIEW or LOCAL according to what actually ran, with provider and fallback evidence."
    fallback: "Only eligible reads may fall back to LOCAL, with a disclosed reason. An approved LIVE write never redirects."
    prerequisites: [Private Azure/Fabric/Foundry bindings in ignored .env configuration., Entra sign-in and required permissions., Available capacity and services for the connected path.]
    commands: [ffia serve api, ffia demo hybrid --json]
    safety: "The connected demo can consume model usage; active Fabric capacity incurs billing. Live mutations remain disabled by default and need separate approval."
  - mode: LIVE
    title: Strict Azure / Fabric live verification
    description: "Require the connected providers to perform the bounded verification instead of accepting a local answer."
    results: "The demo checks an actual Fabric read and a baseline-reconciled synthetic Foundry answer; the Fabric agent tool is labeled PREVIEW."
    fallback: "LOCAL fallback cannot satisfy the strict live gate. Unavailable or incorrect connected results fail verification."
    prerequisites: [The same private bindings and Entra permissions as the live-first path., Available Fabric capacity and the configured existing Foundry agent.]
    commands: [ffia demo live --json]
    safety: "This performs a bounded cloud read and model question, not deployment or publication. Model usage and capacity can cost money; consequential writes need a separate approved plan."
journeys:
  - id: foundations
    title: "Understand the foundations"
    summary: "Connect relational data, semantic meaning, language models, retrieval and tool loops to the systems we use today. Read theory, challenge assumptions and design an experiment."
    duration_minutes: 60
    lesson_ids: [governed-data-foundations, agent-research-foundations, fabric-foundry-boundaries, p16-evaluation-observability]
  - id: engineer
    title: "Level up Fabric engineering"
    summary: "Use Copilot to improve a repeatable data task, add Skills and Fabric MCP, then verify the result rather than trusting a convincing answer."
    duration_minutes: 90
    lesson_ids: [governed-data-foundations, copilot-surfaces, fabric-skills, fabric-mcp-landscape, copilot-maturity-ladder, power-bi-agentic-tooling]
  - id: agent
    title: "Build a grounded business agent"
    summary: "Trace a sales question from governed Fabric context to Foundry reasoning, baseline evaluation and a reviewed draft."
    duration_minutes: 75
    lesson_ids: [agent-research-foundations, domain-and-agent-composition, p06-enterprise-agent, p08-human-in-the-loop, p16-evaluation-observability, p17-resilience]
  - id: research
    title: "Investigate, specify and verify"
    summary: "Go beyond the walkthrough: form a falsifiable hypothesis, control variables, inspect adverse cases and connect a specification to independent tests."
    duration_minutes: 90
    lesson_ids: [agent-research-foundations, copilot-vs-claude-code, spec-driven-delivery, production-readiness]
briefs:
  - lesson_id: governed-data-foundations
    what: "Logical data contracts define grain, keys and business meaning independently of physical storage."
    why: "A more fluent agent cannot fix an ambiguous population, duplicate-sensitive join or inconsistent measure."
    when: "Use these foundations before building a lakehouse, semantic model, report or structured-data agent."
    when_not: "Do not introduce extra platform layers when a small, well-defined query already meets the need."
    how: [Define the grain and measure population., Validate keys and relationships., Build synthetic layers and reconcile against the expected baseline.]
    expected_result: "The learner can explain an aggregate, reproduce its value and identify a join that would double count."
    failure_and_recovery: "A duplicate key changes the aggregate. Detect it upstream, correct the contract and rebuild rather than patching the report."
    diagram: theory-to-tools
    research: &data-research
      question: "Does an explicit data contract prevent incorrect aggregate interpretation?"
      foundations:
        - idea: Logical data independence
          explanation: "The relational model distinguishes logical relations from the physical representation used to store them."
          application: "Keep named business measures and keys stable while changing lakehouse storage or transformation implementation."
        - idea: Grain and relational operations
          explanation: "A relation represents facts at an agreed grain; a join can multiply matches rather than merely attach a label."
          application: "Test uniqueness and relationship cardinality before using Gold totals in a report or agent answer."
      evolution: [Relational abstractions separate meaning from representation., Warehouses organize reusable analytical facts and dimensions., Lakehouse layers preserve provenance while preparing serving data., Semantic contracts expose governed meaning to reports and agents.]
      hypothesis: "Validating grain and key uniqueness before aggregation detects a duplicate-sensitive join that a final row-count check misses."
      experiment: "Use a scratch copy of synthetic facts. Run the baseline query, introduce one duplicate dimension key, and rerun the identical query and key checks. Keep source facts, filters and arithmetic fixed."
      baseline: "The committed synthetic expected measure and unique-key checks."
      metrics: [Aggregate difference, Duplicate keys detected, Rejected or flagged records]
      limitations: [A synthetic distribution does not establish production scale or skew., Correct arithmetic does not establish permitted access.]
      sources: [research-relational-model, fabric-medallion, fabric-direct-lake]
  - lesson_id: agent-research-foundations
    what: "A model, retrieved context, tools and a harness perform different jobs in an agent system."
    why: "Separating prediction from observed evidence makes unsupported claims and unsafe actions easier to detect."
    when: "Use this foundation before evaluating assistants, selecting grounding methods or connecting tools."
    when_not: "Do not add an agent when a fixed report or deterministic rule already solves the task."
    how: [Identify the model and context boundaries., Trace an actual tool event and its returned result., Compare a grounded answer with an independent baseline.]
    expected_result: "The learner can distinguish a proposed action, an invoked tool and a verified outcome."
    failure_and_recovery: "Missing context must cause an explicit limitation or labeled permitted fallback, not an invented factual answer."
    diagram: theory-to-tools
    research: &agent-research
      question: "When does external governed context improve a bounded agent answer?"
      foundations:
        - idea: Prediction versus evidence
          explanation: "Attention-based sequence modeling supports generation, but does not itself verify external facts or execute operations."
          application: "Do not infer numeric correctness, tool execution or permission from the fluency of an assistant response."
        - idea: Retrieval and action observations
          explanation: "RAG studies external retrieved information; ReAct studies interleaving processing with actions and observations."
          application: "Select relevant context, record actual tool results and score the final answer independently of the model."
      evolution: [Sequence models generate from learned patterns and context., Retrieval augments model parameters with selected external information., Tool loops incorporate observations from an environment., Product harnesses add identity, policies and evaluation around the loop.]
      hypothesis: "Relevant governed context reduces unsupported numeric claims on a fixed synthetic question set compared with no supplied context."
      experiment: "Compare no context, a relevant synthetic context packet and a governed tool result on the same held-out questions. Hold model, prompt and scoring rules fixed; retain failures and execution labels."
      baseline: "Deterministic synthetic expected answers, not another model's response."
      metrics: [Numeric correctness, Claim-level source support, Invalid tool calls, Latency and cost]
      limitations: [The deterministic offline agent cannot measure language-model reasoning., Original papers do not prove a proprietary product's architecture or performance.]
      sources: [research-transformers, research-rag, research-react, foundry-agent-service]
  - lesson_id: copilot-maturity-ladder
    what: "The L0-L6 ladder adds repository grounding, procedures, connected context and governed change to assisted coding."
    why: "Each added capability introduces a new failure mode and therefore needs a control and observable evidence."
    when: "Use the ladder to plan how a Fabric engineering team adopts Copilot on one repeatable task."
    when_not: "Do not interpret a higher rung as permission for autonomous production writes or a guaranteed productivity gain."
    how: [Choose one Silver transformation task., Compare manual and assisted artifacts against the same baseline., Add Skills and read-only MCP context., Measure correctness and review work before considering governed writes.]
    expected_result: "A before/after scorecard names the added capability, control, test result and actual tool provenance."
    failure_and_recovery: "If a live tool is unavailable, disclose it and use only the named read fallback; stop a failed live write."
    diagram: agentic-de
    research: &engineering-research
      question: "Which component of an assisted engineering workflow actually improves the task?"
      foundations:
        - idea: Independent verification
          explanation: "A generated artifact must be judged against an independent behavioral contract, not its author's confidence."
          application: "Reconcile candidate Silver transformations and DAX with the same committed synthetic baseline."
        - idea: Controlled component ablation
          explanation: "Removing one component while holding other conditions fixed helps isolate its contribution under the tested conditions."
          application: "Compare instructions, Skills and read-only MCP context separately instead of changing all of them and the model at once."
      evolution: [Completions assist local edits., Repository instructions constrain conventions and contracts., Skills provide repeatable domain procedures., MCP supplies bounded observed context., Governed review ties changes to approvals and verification.]
      hypothesis: "Adding task-specific context reduces invalid assumptions and reviewer corrections without weakening approval controls."
      experiment: "Run one synthetic transformation task with fixed inputs and scoring under baseline assistance, instructions, a Skill and read-only context. Record model and prompt revisions, failed trials and review corrections."
      baseline: "The manual reference artifact and committed deterministic expected outputs."
      metrics: [Checks passed, Reviewer corrections, Invalid calls, Observed elapsed time, Evidence completeness]
      limitations: [Observed timing is task-specific rather than a product benchmark., Claude Code remains documented-only unless an actual comparable run is recorded.]
      sources: [research-react, copilot-cli-ga, skills-for-fabric, fabric-mcp-local]
  - lesson_id: copilot-vs-claude-code
    what: "A fair harness comparison holds the task, dataset, constraints and scoring rules constant."
    why: "A recorded Copilot result and a documented Claude prompt are different evidence categories."
    when: "Use the evaluation framework when deciding how a team should use alternative coding harnesses."
    when_not: "Do not claim a winner from unrelated demonstrations, different models or documented-only paths."
    how: [Inspect the recorded bake-off., Identify missing comparable runs., Define an identical task and scorecard before any new evaluation.]
    expected_result: "The comparison explicitly separates measured observations from documented capabilities."
    failure_and_recovery: "If a harness cannot run, mark it documented-only or unavailable rather than fabricating a score."
    diagram: agentic-de
    research: {<<: *engineering-research, question: "What would make a Copilot and Claude comparison fair and reproducible?"}
  - lesson_id: copilot-surfaces
    what: "VS Code, CLI, App and cloud-agent surfaces offer different interaction, review and execution environments."
    why: "Selecting a surface changes context availability, approval handling and where artifacts are reviewed."
    when: "Use a surface that matches interactive development, terminal automation or a bounded issue-to-PR task."
    when_not: "Do not treat preview parallel work or a cloud coding agent as a default production deployment mechanism."
    how: [Identify the task and review environment., Select the harness and narrow tools., Record the actual invocation and artifact diff.]
    expected_result: "The learner can explain which surface fits the task and which capability remains preview or documented-only."
    failure_and_recovery: "A missing integration is a disclosed limitation; move to a separately chosen supported workflow, not a mislabeled result."
    diagram: mcp-topology
    research: {<<: *engineering-research, question: "How does the interaction surface affect review quality and reproducibility?"}
  - lesson_id: fabric-skills
    what: "A Skill is versioned procedural guidance loaded by an agent; it is not a cloud operation by itself."
    why: "Domain procedures reduce repeated guessing about notebook, model and report workflows."
    when: "Use the narrow Skill for medallion planning, Spark work, semantic modeling or report authoring."
    when_not: "Do not assume a Skill grants permissions or automatically invokes Fabric MCP."
    how: [Install the curated verified bundle using ffia skills install., Load the named Skill for the task., Review its required tools and proposed actions before execution.]
    expected_result: "A reviewed artifact follows the procedure and its tool calls have explicit labels and provenance."
    failure_and_recovery: "If a Skill names an unavailable tool, stop that step; do not silently substitute a different executor."
    diagram: agentic-de
    research: {<<: *engineering-research, question: "Does a domain procedure reduce invalid artifacts without increasing unsafe tool use?"}
  - lesson_id: fabric-mcp-landscape
    what: "Fabric MCP servers expose distinct documentation, item and data capabilities; they are not interchangeable."
    why: "The correct server and actual tool call distinguish connected context from local teaching simulation."
    when: "Use Fabric MCP first for the coding workflow and the narrowest permitted tool for each step."
    when_not: "Do not use the application's REST provider as proof that a guide-assigned MCP operation ran."
    how: [Review the fabric-first profile., Discover the named read-only tool., State provider and server before calling it., Disclose unavailability before offering the named ffia-local read fallback.]
    expected_result: "The result records the real tool, execution label and any fallback reason."
    failure_and_recovery: "Read fallback is LOCAL; a failed live write stops and any rehearsal is separately SIMULATED."
    diagram: integration-paths
    research: {<<: *engineering-research, question: "Does bounded live metadata reduce schema assumptions relative to synthetic context?"}
  - lesson_id: power-bi-agentic-tooling
    what: "Power BI models and reports encode governed measures and visual interpretation, with separate authoring and publication steps."
    why: "A local model or polished visual is not proof of correct DAX or successful publication."
    when: "Use authoring Skills and the assigned modeling tools when a governed measure or report needs reviewed changes."
    when_not: "Do not regenerate reports when an existing governed report already meets the question."
    how: [Inspect grain and model relationships., Author a reviewed local change., Reconcile DAX against Gold., Publish only after a separate approved operation.]
    expected_result: "Measures reconcile and publication evidence is recorded separately from local authoring."
    failure_and_recovery: "A mismatched measure requires an upstream contract or DAX correction, not a cosmetic visual workaround."
    diagram: hc-01
    research: {<<: *data-research, question: "Can independent measure reconciliation detect a convincing but incorrect report?"}
  - lesson_id: fabric-foundry-boundaries
    what: "Fabric owns governed context; Foundry supplies reasoning and orchestration; identity and policy determine authority."
    why: "Clear ownership prevents models, transport protocols and transactional systems from being conflated."
    when: "Use these boundaries whenever combining data, agents, tools and consequential actions."
    when_not: "Do not add Foundry reasoning to a task that only needs deterministic analytics."
    how: [Trace context and reasoning separately., Identify the system of record., Locate permission and approval checks., Inspect returned execution evidence.]
    expected_result: "The learner can name the owner and authority at every hop of a request."
    failure_and_recovery: "An unauthorized action is refused explicitly; it is not redirected to another identity or destination."
    diagram: reference
    research: {<<: *agent-research, question: "Can an architecture boundary prevent reasoning output from becoming unauthorized action?"}
  - lesson_id: preview-isolation
    what: "Preview integrations are optional dependencies with flags, honest labels and offline analogs."
    why: "A default workshop must remain usable when tenant features or preview services are unavailable."
    when: "Use isolation for Fabric IQ, ontology and other preview-dependent agent paths."
    when_not: "Do not require preview availability to complete the default offline demonstration."
    how: [Inspect enabled preview flags., Compare flagged and unflagged behavior., Verify explicit UNAVAILABLE or labeled simulation results.]
    expected_result: "The stable path works without preview configuration and no simulation is presented as live."
    failure_and_recovery: "Disable the optional feature and use the documented analog without claiming feature certification."
    diagram: live-vs-offline
    research: &operations-research
      question: "Do explicit boundaries preserve correct behavior under an unavailable dependency?"
      foundations:
        - idea: Failure containment
          explanation: "A dependency failure should have a bounded blast radius and a defined caller-visible outcome."
          application: "Use timeouts, bounded retries, circuit breakers and explicit unavailable or permitted fallback results."
        - idea: Independent safety properties
          explanation: "Availability, correctness and authorization are separate properties and cannot substitute for each other."
          application: "An available local answer cannot certify live execution; a successful write cannot establish that it was authorized."
      evolution: [Single dependencies expose callers directly to failures., Routing introduces bounded retries and failure state., Explicit fallback preserves a permitted read experience., Governed writes bind approval to the exact destination and never redirect.]
      hypothesis: "Explicit fallback policy preserves permitted read continuity without mislabeling execution or redirecting a live write."
      experiment: "Run the same synthetic read and write-plan cases with healthy, unavailable and invalid-input conditions. Inspect labels, fallback reasons, audit events and refusal behavior. Keep requests and policy fixed."
      baseline: "The healthy deterministic response and the repository's approval and fallback invariants."
      metrics: [Expected refusals, Correct execution labels, Recovery behavior, Unauthorized redirects]
      limitations: [Fault injection is not a real tenant outage or recovery drill., Successful offline tests do not establish production network or identity configuration.]
      sources: [fabric-waf, foundry-agent-service, fabric-rest-identity]
  - lesson_id: p06-enterprise-agent
    what: "An enterprise agent combines governed context, bounded reasoning, tools, evaluation and reviewable actions."
    why: "Useful business answers need both trustworthy context and explicit limits on what the agent may do."
    when: "Use this pattern for contextual questions and reviewed proposals across governed business information."
    when_not: "Do not replace a sufficient report or deterministic transaction rule with an unbounded agent."
    how: [Choose a bounded sales question., Obtain governed Fabric context., Inspect the Foundry tool result., Evaluate against the baseline before using the answer in a draft.]
    expected_result: "The answer is supported by permitted context, reconciled numbers and a clear execution label."
    failure_and_recovery: "Missing or unsupported context leads to refusal or explicit fallback, never invented figures."
    diagram: mfg-01
    research: *agent-research
  - lesson_id: p08-human-in-the-loop
    what: "A governed action separates proposed intent, deterministic validation, human approval and scoped execution."
    why: "Neither model intent nor MCP access proves that a user may perform a consequential change."
    when: "Use the flow for high-impact, destructive, regulated or difficult-to-reverse operations."
    when_not: "Do not add a mutation approval ceremony to a harmless read that policy already permits."
    how: [Propose the exact target and destination., Validate duplicates and policy., Obtain separate approval., Execute through the authorized writer and verify the result.]
    expected_result: "The audit distinguishes planning from authorization and observed execution."
    failure_and_recovery: "Expired or wrong-target approval is refused; a missing live writer returns UNAVAILABLE without redirecting."
    diagram: system
    research: {<<: *operations-research, question: "Does destination-bound approval block an unauthorized change after planning?"}
  - lesson_id: p09-governed-mcp
    what: "Governed MCP uses typed narrow tools and identity-aware policy without granting arbitrary execution."
    why: "A shared capability interface becomes dangerous if tool access is mistaken for authority."
    when: "Use this pattern when multiple agent harnesses need bounded, reusable capability access."
    when_not: "Do not expose unrestricted shell, SQL, filesystem or REST-proxy tools."
    how: [Review the allowlist., Separate read profiles from authoring profiles., Confirm identity and tool provenance., Verify refusal of disallowed actions.]
    expected_result: "The harness can access only the intended capability and retains explicit approval boundaries."
    failure_and_recovery: "A denied tool is not retried through a different transport to bypass policy."
    diagram: mcp-topology
    research: {<<: *operations-research, question: "Can a narrow tool interface contain a mistaken or adversarial action request?"}
  - lesson_id: p10-medallion-ai
    what: "Bronze, Silver and Gold organize provenance, validation and business-ready context."
    why: "Agents and reports need reproducible data meaning rather than directly interpreting raw extracts."
    when: "Use layers when reusable transformations, lineage and controlled corrections matter."
    when_not: "Do not add layers solely because a diagram looks more complete."
    how: [Preserve raw values., Apply reviewed Silver types and quality rules., Build Gold measures., Reconcile each layer with synthetic expected outputs.]
    expected_result: "Counts, quality diagnostics and measures explain every deliberate change in population."
    failure_and_recovery: "Preserve Bronze and rerun the reviewed transformation rather than manually editing a serving total."
    diagram: hc-01
    research: *data-research
  - lesson_id: p11-mirroring-ai
    what: "Mirroring recovery combines a consistent snapshot with ordered replay of operational changes."
    why: "A fresh-looking replica may still omit, duplicate or misorder changes after interruption."
    when: "Use recovery reasoning when operational replication supplies analytics or agent context."
    when_not: "Do not describe the repository's simulated drill as a real Open Mirroring recovery."
    how: [Inspect the synthetic snapshot., Replay bounded changes., Compare final state with the baseline., Record checkpoint and duplicate behavior.]
    expected_result: "The SIMULATED final state reconciles and replay does not silently apply a change twice."
    failure_and_recovery: "A missing checkpoint requires explicit snapshot or replay recovery, not an assumption that replication is current."
    diagram: live-vs-offline
    research:
      <<: *operations-research
      question: "Does checkpointed replay preserve expected state after an interrupted synthetic stream?"
      hypothesis: "A stable checkpoint and idempotent replay reproduce the expected final state; missing or repeated changes without those controls do not."
      experiment: "Run the synthetic recovery drill, then compare a scratch missing-change and repeated-change replay with the same snapshot and expected final state. Keep source records and transformations fixed."
      baseline: "The committed synthetic final-state reference, not the replay candidate."
      metrics: [Final-state differences, Duplicate effects, Missing changes, Checkpoint recovery]
  - lesson_id: p16-evaluation-observability
    what: "Evaluation tests quality; tracing records observable events; neither replaces the other."
    why: "A successful request or telemetry ingestion does not establish answer correctness or server-side trace completeness."
    when: "Use independent quality gates and traceable run evidence before presenting or promoting an agent."
    when_not: "Do not use a single aggregate score or a configured monitor as proof of reliable behavior."
    how: [Define expected answers and adverse cases., Run the bounded evaluation., Inspect tool events and labels., Record failures and unresolved trace gaps.]
    expected_result: "Quality, routing and observed execution can be inspected separately."
    failure_and_recovery: "A missing trace remains unverified; a failed baseline blocks certification rather than being averaged away."
    diagram: mfg-01
    research: {<<: *agent-research, question: "Which independent metrics detect failures that an overall agent score hides?"}
  - lesson_id: p17-resilience
    what: "Resilience uses bounded retry, timeout, breaker state and explicitly permitted read fallback."
    why: "A workshop can remain usable during outages without misrepresenting local results as live."
    when: "Use the router for eligible reads when cloud context may be slow or unavailable."
    when_not: "Do not retry invalid input or redirect an approved live mutation."
    how: [Run healthy and fault-injected reads., Inspect reasons and result labels., Check strict-LIVE refusal., Verify write destination remains unchanged.]
    expected_result: "Fallback is visible, bounded and unable to satisfy a live certification gate."
    failure_and_recovery: "Recover the dependency and inspect routing state; never bypass the failure by changing authority."
    diagram: live-vs-offline
    research: *operations-research
  - lesson_id: production-readiness
    what: "Production readiness combines identity, networking, data ownership, evaluation, cost and operational recovery."
    why: "A passing local demo and an active capacity do not certify a secure reliable deployment."
    when: "Use the checklist when moving a bounded prototype toward an operated service."
    when_not: "Do not mark documented components or deferred GitHub checks as live-verified."
    how: [Review the threat model and owners., Verify identity and permission-negative cases., Define rollout and rollback evidence., Track incomplete tenant and CI checks explicitly.]
    expected_result: "The handoff names verified properties, missing evidence and accountable owners."
    failure_and_recovery: "An unmet gate remains a blocker or explicit scope exclusion, not a success-shaped fallback."
    diagram: production
    research:
      <<: *operations-research
      question: "Which prototype observations fail to establish production safety or reliability?"
      hypothesis: "Independent negative-access, gateway-policy and overlay-restriction tests expose authority gaps that a successful demo request cannot detect."
      experiment: "Define a synthetic access matrix before testing. Compare allowed and denied requests, gateway acceptance with backend refusal, and narrowing with attempted-widening overlays. Record local contract results separately from any approved tenant validation."
      baseline: "Reviewed access decisions and global authority invariants."
      metrics: [Correct access refusals, Unauthorized scope expansion, Gateway policy outcomes, Added latency]
      sources: [fabric-waf, fabric-rest-identity, apim-mcp, fabric-deployment-patterns]
  - lesson_id: domain-and-agent-composition
    what: "Domain ownership, bounded tools and independently managed agents are different architectural boundaries."
    why: "Splitting by department alone adds coordination and access risks without proving a benefit."
    when: "Use this comparison when one workflow needs context from several governed business domains."
    when_not: "Do not add a coordinator when a deterministic router or one bounded agent meets the contract."
    how: [Define domain vocabulary and permitted facts., Create expected route and denial cases., Compare deterministic routing with one bounded agent., Add agents only for demonstrated lifecycle or policy differences.]
    expected_result: "The chosen boundary has a reason, an independent routing baseline and explicit per-domain authorization."
    failure_and_recovery: "Ambiguity requires clarification; denied access must not retry through an administrator or unrestricted domain."
    diagram: reference
    research:
      <<: *agent-research
      question: "Does agent decomposition improve domain routing without increasing unauthorized disclosure?"
      hypothesis: "For distinct tool and ownership boundaries, a bounded domain arrangement improves route accuracy compared with one unconstrained agent; for simple vocabulary routing it may only add overhead."
      experiment: "Compare deterministic routing, one bounded agent and a reviewed multi-agent candidate on the same held-out synthetic requests, identities and tools. Stratify ambiguous and denied cases; record failures and overhead."
      baseline: "Independently authored expected route and access decisions."
      metrics: [Route accuracy, Unauthorized disclosures, Unsupported claims, Tool calls and latency]
      limitations: [A local router cannot establish language-model routing performance., Synthetic tests do not certify preview Fabric IQ identity propagation.]
      sources: [agent-framework, fabric-iq-overview, fabric-data-agent]
  - lesson_id: enrichment-and-event-context
    what: "Batch enrichment stores versioned derived data; event triage uses timely context to propose a response."
    why: "Model quality and temporal correctness need separate contracts, references and recovery rules."
    when: "Use enrichment for reusable interpretation and event context when timeliness changes the decision."
    when_not: "Keep deterministic thresholds and calculations outside a model when they already solve the task."
    how: [Define the enrichment schema and independent labels., Define event keys and freshness policy., Compare candidate output with fixed references., Test duplicates and out-of-order replay before considering live execution.]
    expected_result: "Quality, context age and repeated effects are measured independently; actions remain reviewed proposals."
    failure_and_recovery: "Reject malformed or stale context explicitly and apply bounded retries without duplicate authoritative effects."
    diagram: reference
    research:
      <<: *data-research
      question: "Do explicit quality and event-time contracts expose errors hidden by successful pipeline completion?"
      foundations:
        - {idea: Derived data provenance, explanation: "An interpreted field depends on its source and transformation version, not merely its output type.", application: "Persist lineage and evaluate labels independently of the candidate."}
        - {idea: Temporal state and idempotency, explanation: "Occurrence order can differ from arrival order, and repeated delivery must not repeat an authoritative effect.", application: "Define freshness, late-event rules and stable event keys before triage."}
      evolution: [Batch transformations create reusable derived facts., Model enrichment introduces quality and version uncertainty., Streams introduce late and duplicate events., Agent triage adds proposals without transferring write authority.]
      hypothesis: "Independent labels and duplicate/late-event tests detect incorrect interpretation or repeated effects even when every processing call reports success."
      experiment: "Use fixed synthetic labels and events. Compare candidate enrichment with reviewed labels, then compare ordered, delayed and duplicate replay with independently expected states and proposals. Keep inputs and rules fixed."
      baseline: "Reviewed synthetic class labels and predefined event-state transitions."
      metrics: [Per-category errors, Rejected malformed outputs, Stale-context refusals, Duplicate effects]
      limitations: [Deterministic enrichment cannot establish model classification performance., Small replay sequences do not establish production throughput or delivery guarantees.]
      sources: [fabric-ai-functions, fabric-overview, fabric-medallion]
  - lesson_id: spec-driven-delivery
    what: "Spec-driven delivery links a user outcome to reviewed requirements, a design, tasks and independent convergence."
    why: "Cross-layer PoCs fail when a convincing implementation replaces the original acceptance criteria."
    when: "Use the full workflow for a new use case, ambiguous requirements or changes across data, API, UI and governance."
    when_not: "Do not require Spec Kit for a typo, narrow repair or normal execution of an existing demo."
    how: [Use the repository spec-driven-delivery Skill., Specify outcomes and exclusions., Review requirement quality and task dependencies., Implement reviewed local work and verify convergence., Treat any cloud mutation as a separately approved change.]
    expected_result: "Every promised outcome maps to an observable test, and remaining gaps are recorded."
    failure_and_recovery: "A contradictory specification needs clarification; generated instructions must not overwrite repository authority."
    diagram: agentic-de
    research:
      <<: *engineering-research
      question: "Does explicit acceptance traceability reduce missing behavior in a cross-layer prototype?"
      hypothesis: "Requirements linked to independent tests expose implementation gaps that a task-completion checklist misses."
      experiment: "Compare a bounded synthetic feature checklist with requirement-to-test traceability on the same candidate implementation. Review omitted adverse cases without changing the acceptance criteria after seeing the result."
      baseline: "The reviewed specification and independent acceptance tests."
      sources: [spec-kit-quickstart, research-react]
use_cases:
  - guide_id: hc-01-fabric-mcp-powerbi-medallion-lab
    problem: "An engineer needs to turn seven imperfect synthetic extracts into trusted analytics without confusing generated code with correct, authorized Fabric execution."
    audience: "Data engineers, analytics engineers and workshop facilitators."
    outcomes: [Explain how Copilot adds value at each engineering stage., Build and reconcile a synthetic medallion and semantic contract., Distinguish Skills from MCP execution and retain evidence for every approved operation.]
    lesson_ids: [governed-data-foundations, copilot-surfaces, fabric-skills, fabric-mcp-landscape, copilot-maturity-ladder, power-bi-agentic-tooling]
    stages:
      - {title: Manual baseline, task: Inspect a Silver transformation and its expected counts., capability: "Understand the grain, quality rules and reference result before asking an agent.", control: Independent deterministic baseline., evidence: Reference SQL and expected measures.}
      - {title: Copilot assistance, task: Draft and explain a transformation with tests., capability: "Copilot accelerates authoring and review preparation; the engineer retains judgment.", control: Review assumptions and compare outputs., evidence: Artifact diff and test results; no invented time saving.}
      - {title: Repository grounding, task: Apply shared conventions and boundaries., capability: "Instructions provide the local architecture and quality contract.", control: Strict types and deterministic validation., evidence: Relevant checks and recorded reviewer corrections.}
      - {title: Fabric Skills, task: Follow the medallion or Spark procedure., capability: "Skills provide repeatable domain guidance, not permission or automatic execution.", control: Curated pinned procedures and separate proposed actions., evidence: Reviewed artifact and named procedure.}
      - {title: Fabric MCP context, task: Inspect the assigned workspace context., capability: "The real Fabric MCP tool supplies observed metadata rather than guessed schemas.", control: Narrow read tools and disclosed named fallback., evidence: Actual invocation and result label; REST results are not MCP proof.}
      - {title: Governed execution, task: Build and reconcile the intended Fabric artifacts., capability: "The assigned tool or extension performs the approved operation; Copilot coordinates.", control: Duplicate check and exact-target human approval., evidence: Counts and DAX against the baseline plus separate execution and publication evidence.}
    production_gaps: [Fresh complete Guide 1 MCP and Power BI publication evidence remains separate., Claude Code is DOCUMENTED ONLY in the bake-off., Production identity and deployment gates are not certified by this prototype.]
    presenter_path: /talktracks/fabric-copilot-level-up.html
  - guide_id: mfg-01-foundry-fabric-sales-insights
    problem: "Business teams need explainable sales insights over governed data, with proposals for quality fixes rather than an agent silently changing records."
    audience: "Business analysts, data stewards, agent engineers and workshop facilitators."
    outcomes: [Trace a sales question through Fabric context and Foundry reasoning., Reconcile the answer against an independent baseline., Produce a reviewed synthetic brief and explain the limits of web context and proposed corrections.]
    lesson_ids: [governed-data-foundations, agent-research-foundations, p06-enterprise-agent, p08-human-in-the-loop, p16-evaluation-observability]
    questions:
      - "How did booked revenue change between the two synthetic periods?"
      - "Which team or product group explains the change?"
      - "How does performance compare with synthetic targets?"
      - "Which data-quality issues could distort the answer?"
      - "What should a reviewed monthly brief explain and what must remain a proposal?"
    stages:
      - {title: Business question, task: Choose one bounded sales question., capability: "The analyst defines the population and decision, not just a vague request for insights.", control: Agreed measure and independent baseline., evidence: Question and expected synthetic answer.}
      - {title: Governed Fabric context, task: Obtain permitted structured context., capability: "Fabric owns the data meaning and access; its data agent is read-only.", control: Identity and data permissions., evidence: Actual context result and execution label.}
      - {title: Foundry reasoning, task: Explain the context and its supported conclusion., capability: "Foundry coordinates tools and reasons over returned context; Copilot helps author and test the integration.", control: Bounded tool use and evaluation., evidence: Observed tool event and baseline-reconciled answer.}
      - {title: Reviewed brief, task: Draft the monthly team explanation., capability: "The workflow produces a reviewable draft, not an automatically delivered business decision.", control: Human review and separately approved delivery., evidence: Synthetic draft and quality checks; scheduling is not claimed as executed.}
      - {title: Proposed data correction, task: Explain an upstream quality issue., capability: "The agent proposes; a steward approves; a scoped Fabric process corrects Silver.", control: Exact-target approval and verification., evidence: Quality diagnostics and reviewed plan; no automatic fix.}
    production_gaps: [Monthly live scheduling and delivery are not verified., Web grounding needs licensing and boundary review; never send confidential figures in queries., Fresh server-side trace verification remains open., Claude Code is DOCUMENTED ONLY.]
    presenter_path: /talktracks/foundry-fabric-agents-workshop.html
