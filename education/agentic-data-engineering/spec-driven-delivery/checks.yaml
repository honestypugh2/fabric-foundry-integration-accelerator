checks:
  - {id: exec-outcome, level: executive, question: "What should a PoC specify first?", choices: [A fashionable model, The user outcome and measurable success criterion, Every possible feature], answer: 1, explanation: "A prototype tests a bounded outcome rather than an unbounded feature list."}
  - {id: l100-commands, level: l100, question: "Where is speckit-specify invoked?", choices: [As an agent Skill in chat, As a SQL command, As a Fabric API], answer: 0, explanation: "Spec Kit Skills are agent invocations, not terminal or Fabric commands."}
  - {id: l200-feature, level: l200, question: "Does changing Git branches select the active Spec Kit feature?", choices: [Always, No feature state must be selected separately], answer: 1, explanation: "Feature resolution uses the state file or feature-directory environment variable."}
  - {id: l300-authority, level: l300, question: "Does an approved specification authorize a live write?", choices: ["Yes", Only if an agent implements it, No a separate governed approval is required], answer: 2, explanation: "Planning and implementation artifacts do not grant cloud authority."}
  - {id: l400-checklist, level: l400, question: "What does a requirements-quality checklist establish?", choices: [All code is implemented, Requirements meet the reviewed quality criteria, Production deployment succeeded], answer: 1, explanation: "Requirements quality and implementation completion are different gates."}
