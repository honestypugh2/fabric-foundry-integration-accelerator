id: p06-enterprise-agent
area: patterns
title: "P06: Fabric + Foundry enterprise agent (anchor)"
summary: >-
  The anchor pattern end to end: Fabric supplies governed context, a Foundry agent reasons,
  orchestrates and is evaluated, MCP standardizes tool access, Entra identity and policy decide
  authority, a human approves any action, and every step leaves evidence.
status: MIXED
pattern_ids: [P06]
learning_objectives:
  - Trace one request through context, reasoning, access, authority, action and evidence.
  - Assign each responsibility to the right layer (Fabric, Foundry, MCP, Entra and policy, business system).
  - Separate the GA building blocks from the preview dependencies and plan a path that does not need the previews.
  - Run the parts of the pattern that exist offline in this repository and explain honestly which parts still need tenant validation or arrive later.
prerequisites: [fabric-foundry-boundaries]
concepts:
  - term: Governed context
    definition: Curated Fabric data (Gold tables, a semantic model, a published data agent) that already carries business definitions, security and lineage.
  - term: Enterprise agent
    definition: An application agent in Foundry Agent Service or Agent Framework that reasons over governed context, calls tools, is evaluated and traced, and may only propose actions.
  - term: Identity passthrough
    definition: The agent calls Fabric on behalf of the signed-in user, so Fabric permissions such as row-level security apply to that user rather than to a shared service account.
  - term: Execution label
    definition: The tag on every result (LIVE, HYBRID, LOCAL, SIMULATED, MOCKED, PREVIEW, UNAVAILABLE) that says what really ran.
  - term: Evidence trail
    definition: Audit records, traces and evaluation results joined by one correlation ID, proving what the agent read, proposed and did.
evidence:
  - statement: Foundry Agent Service and Microsoft Agent Framework are generally available as of October 2026; Agent Framework supports MCP tools, workflows with checkpoints and tool approval.
    category: DOCUMENTED BEHAVIOR
    sources: [foundry-agent-service, agent-framework, foundry-overview]
  - statement: The Foundry tool that calls a Fabric data agent is in preview and supports user identity (passthrough) only; service principal authentication is not supported.
    category: PREVIEW LIMITATION
    sources: [foundry-fabric-tool]
  - statement: A Fabric data agent answers questions over lakehouse, warehouse and semantic model sources using the caller's Fabric permissions.
    category: DOCUMENTED FABRIC BEHAVIOR
    sources: [fabric-data-agent]
  - statement: Core Foundry evaluators (for example groundedness, relevance and tool call accuracy) are GA; several agent evaluators are in preview.
    category: DOCUMENTED BEHAVIOR
    sources: [foundry-evaluators]
  - statement: Governed reads, local evaluation against a baseline, the change flow and audit run offline today; the agent act of the offline demo runs a deterministic local agent labeled LOCAL, which answers through a governed data tool and is not presented as Foundry.
    category: SIMULATED LOCALLY
  - statement: The routed path to a live Foundry agent, live agent evaluation and the monthly-insights workflow over the live agent are implemented but opt-in and have not been validated end to end.
    category: REQUIRES TENANT VALIDATION
    sources: [foundry-agent-service, agent-framework-workflows]
  - statement: Whether passthrough, row-level security and tool approval behave as documented must be confirmed in your own tenant with your own roles before go-live.
    category: REQUIRES TENANT VALIDATION
    sources: [foundry-fabric-tool, fabric-rest-identity]
  - statement: Keep the default production path on GA building blocks and add preview tools behind feature flags with a GA fallback.
    category: PRODUCTION RECOMMENDATION
try_it:
  - label: Run the ten-act offline demo and read acts 2, 3, 5, 6 and 10
    command: ffia demo offline
    result_label: SIMULATED
  - label: See which providers are configured (offline, foundry_agent is the Local sales agent)
    command: curl -s localhost:8000/api/v1/runtime/providers
    result_label: LOCAL
  - label: Evaluate the synthetic semantic model against the committed baseline
    command: "curl -s -X POST localhost:8000/api/v1/evaluations/run -H 'Content-Type: application/json' -d '{\"profile\": \"hc-lab-7file-v1\", \"observed_label\": \"LOCAL\"}'"
    result_label: LOCAL
copilot_prompt: >-
  Using the ffia-local MCP server, call get_architecture_pattern for P06 and get_runtime_status.
  Then draw a text diagram of the P06 request path (context, reasoning, access, authority, action,
  evidence) and mark each hop as available offline, available opt-in but requiring tenant
  validation, arriving in a later phase, or PREVIEW. Do not
  claim that any Foundry or Fabric call ran.
claude_code_prompt: >-
  Read education/patterns/catalog.yaml (P06 and P08) and src/fabric_foundry_accelerator/services/demo.py.
  Explain which acts of the offline demo implement parts of P06, why act 6 is labeled LOCAL rather
  than Foundry, and how the opt-in Foundry provider is routed without breaking the offline release gate.
production_notes:
  - Use user identity passthrough for Fabric reads so row-level security and workspace roles apply to the person asking, not to the agent.
  - Give the agent its own Entra identity for tracing and tool calls, and keep it read-only; authoritative writes go through P08 with a separate scoped writer.
  - Allow-list the agent's MCP tools, require approval for anything that changes state, and treat tool output as untrusted input (indirect prompt injection).
  - Gate releases on evaluation (groundedness, tool call accuracy, task adherence) and keep traces in Application Insights with a retention policy.
  - Pin preview tools behind feature flags with a GA fallback (for example a semantic model query or a data agent called through a reviewed API).
sources: [foundry-agent-service, agent-framework, fabric-data-agent, foundry-fabric-tool, foundry-evaluators, foundry-overview, fabric-rest-identity, baseline-foundry-chat]
related_labs: [lab-governed-change]
related_guides: [hc-01-fabric-mcp-powerbi-medallion-lab]
