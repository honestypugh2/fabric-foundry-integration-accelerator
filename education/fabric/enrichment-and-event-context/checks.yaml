checks:
  - {id: executive-outcome, level: executive, question: "When is batch enrichment appropriate?", choices: [A reusable derived field with reviewed quality, Every interactive question, Any urgent signal], answer: 0, explanation: "Enrichment persists a derived data product; interactive and event workflows have different requirements."}
  - {id: l100-event-time, level: l100, question: "What is event time?", choices: [When the processor received the event, When the event occurred, When a dashboard refreshed], answer: 1, explanation: "Occurrence and arrival time can differ."}
  - {id: l200-baseline, level: l200, question: "What should evaluate classification quality?", choices: [Labels generated by the candidate itself, Independently reviewed labels, A successful API response alone], answer: 1, explanation: "Candidate outputs must be compared with an independent reference."}
  - {id: l300-replay, level: l300, question: "What should duplicate replay avoid?", choices: [Observing the duplicate, A second authoritative effect for the same event, Recording a refusal], answer: 1, explanation: "Idempotency prevents repeated authoritative effects without hiding processing evidence."}
  - {id: l400-authority, level: l400, question: "Does correct urgent triage authorize a write?", choices: ["Yes", "No, policy and authenticated approval still apply"], answer: 1, explanation: "Timing and correctness do not confer transactional authority."}
