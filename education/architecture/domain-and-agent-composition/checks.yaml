checks:
  - {id: executive-agent-count, level: executive, question: "What justifies a separate agent?", choices: [A second department name, An independent tool or policy lifecycle, A larger diagram], answer: 1, explanation: "Independent ownership, context, tools or policy can justify an agent boundary."}
  - {id: l100-domain, level: l100, question: "Does one agent necessarily serve only one domain?", choices: ["Yes", "No, it can use multiple permitted bounded tools"], answer: 1, explanation: "Domain and agent boundaries need not coincide."}
  - {id: l200-authorization, level: l200, question: "What does successful routing establish?", choices: [Permission to read all selected data, A selected destination that still needs authorization, Permission to write], answer: 1, explanation: "Routing is a capability decision, not an authorization grant."}
  - {id: l300-ambiguity, level: l300, question: "What should an ambiguous route do?", choices: [Read every domain, Request clarification, Switch to admin identity], answer: 1, explanation: "Clarification avoids unbounded fan-out and unauthorized access."}
  - {id: l400-evidence, level: l400, question: "What does a synthetic routing test fail to prove?", choices: [The local expected route, Live Fabric IQ permission propagation, The observed local refusal], answer: 1, explanation: "Live preview integration and identity propagation need separate tenant evidence."}
