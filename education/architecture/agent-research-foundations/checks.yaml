checks:
  - {id: exec-baseline, level: executive, question: "What distinguishes a convincing demo from evaluated reliability?", choices: [A longer answer, Independent baselines and disclosed failures, A newer model name], answer: 1, explanation: "Evidence must include failures and an independent definition of correctness."}
  - {id: l100-tool, level: l100, question: "What proves a tool actually ran?", choices: [Its configuration, A proposed call, The invocation event and returned result], answer: 2, explanation: "Availability and intention are not execution evidence."}
  - {id: l200-retrieval, level: l200, question: "Does retrieved context guarantee a correct answer?", choices: [Yes always, No relevance and support still need checking], answer: 1, explanation: "Retrieval can miss evidence or supply misleading content."}
  - {id: l300-ablation, level: l300, question: "How should you test the contribution of a Skill?", choices: [Change the model and all tools too, Remove only the Skill while holding conditions fixed, Compare unrelated tasks], answer: 1, explanation: "Changing multiple variables confounds the component's contribution."}
  - {id: l400-generalize, level: l400, question: "What can a synthetic benchmark establish?", choices: [Universal product superiority, Results under the recorded task conditions, Production authorization], answer: 1, explanation: "A bounded observation does not justify universal or authorization claims."}
