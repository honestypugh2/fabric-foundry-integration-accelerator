checks:
  - {id: exec-meaning, level: executive, question: "What should be agreed before comparing model answers?", choices: [The dashboard theme, The measure population and owner, The model's marketing score], answer: 1, explanation: "A governed measure defines what the answer means and who owns it."}
  - {id: l100-grain, level: l100, question: "Two lines belong to one order. What does counting rows measure?", choices: [Two orders, Two order lines, Two customers], answer: 1, explanation: "The row grain is order line, not order."}
  - {id: l200-join, level: l200, question: "Why can a duplicate dimension key inflate revenue?", choices: [A join can multiply matching fact rows, Gold prevents all duplicates, Models always round upward], answer: 0, explanation: "Multiple dimension matches repeat a fact's contribution."}
  - {id: l300-reference, level: l300, question: "Which reference should verify the candidate calculation?", choices: [The candidate agent answer, The deterministic expected baseline, The prettier report], answer: 1, explanation: "An independent deterministic baseline prevents circular verification."}
  - {id: l400-validity, level: l400, question: "What does an exact total match fail to establish?", choices: [Arithmetic equivalence for that total, Appropriate access control, The observed total itself], answer: 1, explanation: "Correctness and authorized disclosure are separate properties."}
