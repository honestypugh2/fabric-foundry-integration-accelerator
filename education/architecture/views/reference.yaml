  - {id: business-users, icon: identity/Users, label: "Business users", sublabel: "Signed in with Entra ID", kind: person, state: documented, col: 0, row: 1, step: foundry, summary: "People asking questions of governed data through an agent experience. They act with their own identity."}
  - {id: engineers, icon: identity/Users, label: "Data engineers", sublabel: "Build and change Fabric items", kind: person, state: documented, col: 0, row: 4, step: mcp, summary: "Engineers who build pipelines, notebooks and semantic models, increasingly with an AI coding agent."}
  - {id: agent-app, icon: app_services/App_Services, label: "Agent experience", sublabel: "Web app or Teams", kind: app, state: documented, col: 1, row: 1, step: foundry, sources: [baseline-foundry-chat], summary: "The user-facing chat or app that hosts the agent conversation. In the Microsoft baseline Foundry chat architecture this is a web app behind a web application firewall, calling Foundry Agent Service with a managed identity."}
  - {id: coding-agents, icon: general/Code, label: "GitHub Copilot / Claude Code", sublabel: "Agent harness", kind: harness, state: documented, col: 1, row: 4, step: mcp, component: coding-agents}
  # Foundry
  - {id: foundry-models, icon: ai_machine_learning/Foundry_Models, label: "Foundry models", sublabel: "Deployed models", kind: foundry, state: documented, col: 2, row: 0, step: foundry, sources: [foundry-overview], summary: "Models deployed in a Foundry project that the agent uses to reason. Model choice and deployment are Foundry concerns, not Fabric ones."}
  - {id: foundry-agent, icon: ai_machine_learning/Foundry_Agent_Service, label: "Foundry Agent Service", sublabel: "Reasoning and orchestration", kind: foundry, state: documented, col: 2, row: 1, step: foundry, component: foundry-agent}
  - {id: foundry-iq, icon: ai_machine_learning/AI_Foundry_IQ, label: "Foundry IQ knowledge", sublabel: "Cited retrieval", kind: foundry, state: preview, col: 2, row: 2, step: foundry, sources: [foundry-iq], summary: "Knowledge bases that ground the agent in documents with citations, including files in OneLake. Some experiences are in preview."}
  - {id: agent-framework, icon: general/Code, label: "Agent Framework", sublabel: "Code-first agents and workflows", kind: foundry, state: documented, col: 2, row: 3, step: foundry, component: agent-framework}
  # Access
  - {id: apim-gateway, icon: app_services/API_Management_Services, label: "API Management", sublabel: "Optional AI gateway for MCP tools", kind: gateway, state: optional, col: 3, row: 3, step: mcp, component: apim-gateway}
  - {id: fabric-mcp, label: "Fabric MCP servers", sublabel: "Narrowest server per job", kind: mcp, state: documented, col: 3, row: 4, step: mcp, component: fabric-mcp}
  # Fabric
  - {id: fabric-iq, label: "Fabric IQ ontology", sublabel: "Shared business vocabulary", kind: fabric, state: preview, col: 4, row: 0, component: fabric-iq}
  - {id: data-agent, label: "Fabric data agent", sublabel: "Curated Q&A, user permissions", kind: fabric, state: documented, col: 4, row: 1, component: fabric-data-agent}
  - {id: semantic-model, icon: power_platform/PowerBI, label: "Semantic model", sublabel: "Direct Lake, governed measures", kind: fabric, state: documented, col: 4, row: 2, component: semantic-model}
  - {id: onelake, label: "OneLake medallion", sublabel: "Bronze → Silver → Gold", kind: data, state: documented, col: 5, row: 2, component: onelake-medallion}
  - {id: open-mirroring, label: "Open Mirroring", sublabel: "Landing zone replication", kind: data, state: documented, col: 6, row: 2, component: open-mirroring}
  - {id: source-systems, label: "Operational systems", sublabel: "Authority for transactions", kind: external, state: documented, col: 6, row: 3, summary: "The business systems that own transactional truth. Analytics and agents read replicated copies; writes go back only through an approved, scoped path."}
  # Authority
  - {id: entra, icon: other/Entra_Identity, label: "Entra ID", sublabel: "Who is asking", kind: identity, state: documented, col: 1, row: 5, step: authority, component: entra-identity}
  - {id: policy, icon: general/Workflow, label: "Deterministic policy", sublabel: "Validate the proposal", kind: policy, state: implemented, col: 2, row: 5, step: authority, component: policy-engine, repo_path: config/policies/writes.yaml}
  - {id: approval, label: "Human approval", sublabel: "Not the requester", kind: policy, state: implemented, col: 3, row: 5, step: authority, component: human-approval, repo_path: src/fabric_foundry_accelerator/services/changes.py}
  - {id: scoped-writer, label: "Scoped writer", sublabel: "Only the approved change", kind: policy, state: planned, phase: 5, col: 4, row: 5, step: authority, component: scoped-writer}
  - {id: system-of-record, label: "Fabric item or system of record", sublabel: "Verified after the write", kind: external, state: documented, col: 5, row: 5, step: authority, summary: "The target of an approved change. The writer verifies the result against it, and the audit trail records the outcome."}
  # Evidence
  - {id: observability, icon: devops/Application_Insights, label: "Tracing and monitoring", sublabel: "Correlation IDs", kind: evidence, state: documented, col: 1, row: 6, step: evidence, component: observability}
  - {id: evaluation, label: "Evaluation", sublabel: "Baselines and evaluators", kind: evidence, state: implemented, col: 2, row: 6, step: evidence, component: evaluation, repo_path: src/fabric_foundry_accelerator/services/evaluation.py}
