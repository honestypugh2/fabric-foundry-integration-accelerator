edges:
  - {id: mirror-to-lake, source: open-mirroring, target: onelake, label: "Replicate changes", kind: data}
  - {id: sources-to-mirror, source: source-systems, target: open-mirroring, label: "Change files", kind: data}
  - {id: model-to-lake, source: semantic-model, target: onelake, label: "Direct Lake", kind: context}
  - {id: agent-to-model, source: data-agent, target: semantic-model, label: "Governed definitions", kind: context}
  - {id: iq-to-model, source: fabric-iq, target: data-agent, label: "Shared vocabulary", kind: context}
  - {id: users-to-app, source: business-users, target: agent-app, label: "Ask", kind: access, step: foundry}
  - {id: app-to-foundry, source: agent-app, target: foundry-agent, label: "Conversation", kind: reasoning, step: foundry}
  - {id: foundry-to-models, source: foundry-agent, target: foundry-models, label: "Reason", kind: reasoning, step: foundry}
  - {id: foundry-to-iq, source: foundry-agent, target: foundry-iq, label: "Cited knowledge", kind: context, step: foundry}
  - {id: foundry-to-data-agent, source: foundry-agent, target: data-agent, label: "Fabric data agent tool - PREVIEW, on behalf of the user", kind: access, step: foundry}
  - {id: engineers-to-agents, source: engineers, target: coding-agents, label: "Intent", kind: access, step: mcp}
  - {id: agents-to-fabric-mcp, source: coding-agents, target: fabric-mcp, label: "Tools - how and what is", kind: access, step: mcp}
  - {id: framework-to-gateway, source: agent-framework, target: apim-gateway, label: "MCP tools", kind: access, step: mcp}
  - {id: gateway-to-mcp, source: apim-gateway, target: fabric-mcp, label: "Govern, limit, log", kind: access, step: mcp}
  - {id: mcp-to-lake, source: fabric-mcp, target: onelake, label: "Caller's Fabric permissions", kind: access, step: mcp}
  - {id: entra-to-policy, source: entra, target: policy, label: "Who is asking", kind: authority, step: authority}
  - {id: policy-to-approval, source: policy, target: approval, label: "Validated plan", kind: authority, step: authority}
  - {id: approval-to-writer, source: approval, target: scoped-writer, label: "Approved and destination-bound", kind: authority, step: authority}
  - {id: writer-to-target, source: scoped-writer, target: system-of-record, label: "Only the approved write", kind: change, step: authority, planned: true}
  - {id: writer-to-audit, source: scoped-writer, target: audit, label: "Record every step", kind: evidence, step: evidence}
  - {id: eval-to-observability, source: evaluation, target: observability, label: "Scores linked to traces", kind: evidence, step: evidence}
bands:
  - {id: identity-band, kind: identity, step: authority, text: "Identity: users act with their own Entra identity, and Fabric permissions decide what each one sees (on-behalf-of). The writer is a separate, least-privilege identity."}
  - {id: policy-band, kind: policy, step: authority, text: "Authority: models propose, deterministic policy validates, a human approves, and only the scoped writer writes. MCP access and gateway policy never replace backend authorization."}
  - {id: evidence-band, kind: evidence, step: evidence, text: "Evidence: every hop carries a correlation ID and an execution label. A configured server, a tool description or an existing item is not proof that an operation ran."}
traces:
  - id: governed-question
    title: Ask a governed question
    summary: A business user asks a question; the answer comes from governed Fabric definitions under the user's own permissions.
    label: PLANNED FLOW
    steps:
      - {node: business-users, say: "A user asks a question in the agent experience.", note: "Signed in with Entra ID."}
      - {node: agent-app, edge: users-to-app, say: "The app passes the conversation to the Foundry agent.", note: "The app holds no data permissions of its own."}
      - {node: foundry-agent, edge: app-to-foundry, say: "The agent decides it needs governed numbers, not a guess."}
      - {node: data-agent, edge: foundry-to-data-agent, say: "It asks the Fabric data agent on behalf of the user.", note: "The Foundry Fabric data agent tool is in preview and uses the user's identity."}
      - {node: semantic-model, edge: agent-to-model, say: "The data agent answers from the semantic model's governed measures."}
      - {node: onelake, edge: model-to-lake, say: "Direct Lake reads Gold tables in OneLake. Fabric permissions filter what this user may see."}
      - {node: foundry-agent, say: "The agent composes the answer with its sources."}
      - {node: evaluation, say: "Evaluations score groundedness and correctness against expected answers.", note: "Offline, Act 6 of the demo is UNAVAILABLE until Phase 6 - nothing is simulated as Foundry."}
  - id: governed-action
    title: Make a governed change
    summary: An agent proposes a change; policy validates, a person approves, and only the scoped writer executes.
    label: SIMULATED
    demo_act: 5
    steps:
      - {node: foundry-agent, say: "The agent proposes a change, for example a new lakehouse.", note: "Model intent is not proof of authorization."}
      - {node: policy, say: "Deterministic policy checks the operation, workspace, duplicates and risk."}
      - {node: approval, edge: policy-to-approval, say: "A different person approves. Self-approval is refused and audited."}
      - {node: scoped-writer, edge: approval-to-writer, say: "Only the scoped writer executes, and only the approved, destination-bound change."}
      - {node: system-of-record, edge: writer-to-target, say: "The writer verifies the result against the target.", note: "Offline this is a simulated workspace labeled SIMULATED. An approved LIVE change is never redirected to it."}
      - {node: audit, edge: writer-to-audit, say: "Every step is in the audit trail under one correlation ID."}
  - id: engineer-change
    title: Engineer with a coding agent
    summary: An engineer uses GitHub Copilot or Claude Code; MCP gives access to docs and context, and changes still go through review and approval.
    label: PLANNED FLOW
    steps:
      - {node: engineers, say: "An engineer asks the coding agent to design or fix a pipeline."}
      - {node: coding-agents, edge: engineers-to-agents, say: "The harness loads repo instructions and skills - the knowledge to do it correctly."}
      - {node: fabric-mcp, edge: agents-to-fabric-mcp, say: "It uses the narrowest MCP server - docs for how, read-only tools for what is."}
      - {node: onelake, edge: mcp-to-lake, say: "Reads run with the engineer's own Fabric permissions."}
      - {node: policy, say: "Any change becomes a plan or a pull request, never a direct write."}
      - {node: approval, edge: policy-to-approval, say: "A reviewer approves before anything is applied."}
