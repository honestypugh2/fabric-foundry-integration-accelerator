# Reference architecture: Fabric provides governed context, Foundry reasons and acts, MCP is
# access (not authority), identity and policy decide, evidence proves. Customer-neutral.
id: reference
title: Fabric + Foundry reference architecture
kind: reference
summary: >-
  The end-to-end reference: governed business context in Microsoft Fabric, reasoning and
  orchestration in Microsoft Foundry, MCP as standardized capability access, Entra identity and
  policy as authority, a human-approved scoped writer for changes, and evidence at every hop.
cue: >-
  Build it one layer at a time. Fabric first, because the answer is only as good as the governed
  data and definitions. Then Foundry for reasoning. Then MCP for access. Then authority, because
  access is not permission. Then evidence, because a claim without proof is not a result.
columns: 7
rows: 7
doc: reference-architecture
aligned_to: [caf-agent-data-architecture, basic-foundry-chat, baseline-foundry-chat, fabric-medallion, fabric-deployment-patterns, fabric-waf, foundry-fabric-tool, fabric-mcp-servers-list, apim-mcp, foundry-mcp-governance, ai-agent-orchestration]
pattern_ids: [P01, P04, P06, P08, P09, P10, P11, P12, P15, P16]
steps:
  - id: fabric
    label: Fabric governed context
    cue: Start with the data. Mirrored and landed data is refined from Bronze to Gold, and the semantic model holds the business definitions everyone reuses.
  - id: foundry
    label: + Foundry reasoning
    cue: Foundry adds an agent that reasons over that context. It asks a Fabric data agent on behalf of the user, so Fabric permissions still decide what is visible.
  - id: mcp
    label: + MCP access
    cue: MCP standardizes how agents and coding tools reach capabilities. A gateway is optional. Note what MCP does not do - it does not grant authority.
  - id: authority
    label: + Authority
    cue: Any change is proposed, validated by policy, approved by a person and executed only by a narrowly scoped writer. The model never approves.
  - id: evidence
    label: + Evidence
    cue: Traces, evaluations and audit records turn every claim into evidence. Labels say what really ran.
zones:
  - {id: foundry-zone, label: "Microsoft Foundry", kind: foundry, col: 2, row: 0, cols: 1, rows: 4, step: foundry}
  - {id: access-zone, label: "Capability access (MCP)", kind: optional, col: 3, row: 3, cols: 1, rows: 2, step: mcp}
  - {id: fabric-zone, label: "Microsoft Fabric", kind: fabric, col: 4, row: 0, cols: 3, rows: 3}
  - {id: authority-zone, label: "Authority", kind: tenant, col: 1, row: 5, cols: 5, rows: 1, step: authority}
  - {id: evidence-zone, label: "Evidence", kind: tenant, col: 1, row: 6, cols: 4, rows: 1, step: evidence}
nodes:
