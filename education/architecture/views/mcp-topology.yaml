bands:
  - {id: identity, kind: identity, text: "Identity: every server runs with the caller's Entra identity and Fabric permissions. MCP standardizes access; it does not grant authority."}
  - {id: policy, kind: policy, text: "Narrowest server: documentation tools for how, read-only tools for what is, and Git or the approved change flow for change it. Pin server versions; never enable broad write tools by default."}
  - {id: gateway-band, kind: network, step: gateway, text: "A gateway adds central sign-in checks, quotas, logging and versioning. It never replaces record-level authorization in the server or Fabric."}
traces:
  - id: narrowest-server
    title: Pick the narrowest server
    summary: One data-engineering task, three kinds of question, three different servers.
    label: PLANNED FLOW
    steps:
      - {node: copilot-cli, say: "An engineer asks Copilot CLI to add a Silver table for encounters."}
      - {node: mcp-json, edge: cli-config, say: "The harness loads the shared MCP configuration and repo instructions."}
      - {node: learn-mcp, edge: to-learn, say: "How - documentation tools explain the right notebook and Delta patterns. No tenant needed."}
      - {node: fabric-mcp-local, edge: to-fabric-local, say: "What is - read-only tools list the lakehouse tables with the engineer's permissions."}
      - {node: onelake, edge: fabric-local-lake, say: "Fabric permissions decide what the engineer can see."}
      - {node: change-flow, say: "Change it - the notebook arrives as a reviewed pull request or an approved plan, not a direct write."}
  - id: offline-practice
    title: Practice offline
    summary: The same questions answered against synthetic data with no tenant.
    label: LOCAL
    demo_act: 3
    steps:
      - {node: claude-code, say: "Claude Code (or Copilot) uses the same .mcp.json."}
      - {node: mcp-json, edge: claude-config, say: "It starts ffia-local over stdio."}
      - {node: ffia-local, edge: to-ffia, say: "Read tools inspect the medallion; plan tools propose but never execute."}
      - {node: synthetic, edge: ffia-synthetic, say: "Answers come from synthetic data, labeled LOCAL."}
