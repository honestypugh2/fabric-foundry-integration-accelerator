# MCP topology: which harness reaches which server, for which job, under whose identity.
id: mcp-topology
title: MCP topology for Fabric data engineering
kind: topology
summary: >-
  Every agent harness shares one MCP configuration and one set of instructions. Each job uses the
  narrowest server: documentation tools for how, read-only tools for what is, and the approved
  change flow for change it. A gateway is optional.
cue: >-
  Start with the direct path - it is the default and the control. Add the gateway only when
  several clients and teams share the same servers and you need central sign-in, quotas and
  logging. Either way, the caller's Fabric permissions still decide.
columns: 6
rows: 7
doc: mcp-topology
aligned_to: [fabric-mcp-servers-list, fabric-mcp-local, fabric-iq-mcp, fabric-dw-mcp, powerbi-authoring-mcp, apim-mcp, mcp-specification, vscode-mcp-servers]
pattern_ids: [P09, P15, P19]
steps:
  - id: direct
    label: Direct (default)
    cue: Harnesses read .mcp.json and connect directly to each server with the user's identity.
  - id: gateway
    label: + Gateway (optional)
    cue: API Management becomes one front door for MCP tools - central sign-in checks, quotas and audit. Backend authorization stays where it is.
zones:
  - {id: harness-zone, label: "Agent harnesses", kind: local, col: 0, row: 0, cols: 1, rows: 5}
  - {id: knowledge-zone, label: "Shared knowledge and configuration", kind: local, col: 1, row: 0, cols: 1, rows: 3}
  - {id: gateway-zone, label: "Optional gateway", kind: optional, col: 2, row: 2, cols: 1, rows: 1, step: gateway}
  - {id: server-zone, label: "MCP servers", kind: tenant, col: 3, row: 0, cols: 1, rows: 7}
  - {id: target-zone, label: "Fabric and local targets", kind: fabric, col: 4, row: 0, cols: 1, rows: 6}
