  - {id: copilot-app, icon: general/Code, label: "Copilot app", sublabel: "Worktrees, technical preview", kind: harness, state: preview, col: 0, row: 2, summary: "Desktop app running parallel agent sessions in isolated git worktrees, with Plan and Autopilot modes. Technical preview."}
  - {id: cloud-agent, icon: general/Code, label: "Copilot cloud agent", sublabel: "Issue to pull request", kind: harness, state: documented, col: 0, row: 3, summary: "Assign an issue and the agent works in a sandbox and opens a pull request. MCP servers come from repository settings; there is no per-call approval, so the pull request is the control."}
