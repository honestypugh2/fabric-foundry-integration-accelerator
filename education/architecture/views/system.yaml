# This repository at run time: what talks to what, where it lives in the repo, and what is live.
id: system
title: This accelerator at run time
kind: system
summary: >-
  How the educational app, the control plane, the local MCP server, the providers, policies,
  data and audit log fit together in this repository, and which parts are live right now.
cue: >-
  This is the system you are using. Turn on the runtime overlay: every box that is green is
  answering right now; grey boxes arrive in later phases and are never faked.
columns: 7
rows: 6
doc: system-architecture
aligned_to: [baseline-foundry-chat, fabric-mcp-local, mcp-specification]
pattern_ids: [P08, P09, P16, P17]
zones:
  - {id: workstation, label: "Your workstation (offline-capable)", kind: local, col: 0, row: 0, cols: 6, rows: 6}
  - {id: cloud, label: "Microsoft cloud (opt-in)", kind: tenant, col: 6, row: 0, cols: 1, rows: 6}
nodes:
  - {id: web-app, icon: general/Browser, label: "Educational app", sublabel: "React + TypeScript + Vite", kind: client, state: implemented, col: 0, row: 1, component: learner-app, repo_path: frontend/src, runtime: api}
  - {id: coding-agent, icon: general/Code, label: "GitHub Copilot / Claude Code", sublabel: "Reads AGENTS.md", kind: harness, state: implemented, col: 0, row: 4, component: coding-agents, repo_path: AGENTS.md}
  - {id: vite-proxy, label: "Vite dev server", sublabel: "Proxies /api (same origin)", kind: service, state: implemented, col: 1, row: 1, repo_path: frontend/vite.config.ts, summary: "Serves the app on port 5173 and forwards /api to the control plane, so the browser holds no API host or credentials."}
  - {id: mcp-config, icon: general/File, label: ".mcp.json", sublabel: "Shared by every harness", kind: knowledge, state: implemented, col: 1, row: 4, repo_path: .mcp.json, summary: "The portable MCP configuration read by VS Code, Copilot CLI and Claude Code. It lists Microsoft Learn and the local ffia-local server."}
  - {id: api, label: "FastAPI control plane", sublabel: "Thin routes, correlation IDs", kind: service, state: implemented, col: 2, row: 1, repo_path: src/fabric_foundry_accelerator/api, runtime: api, summary: "The control plane. Routes validate input and call services; errors come back in one problem shape. OpenAPI is exported and the frontend types are generated from it."}
  - {id: ffia-local, label: "ffia-local MCP server", sublabel: "stdio, allow-listed tools", kind: mcp, state: implemented, col: 2, row: 4, component: ffia-local-mcp, repo_path: src/fabric_foundry_accelerator/mcp/server.py, runtime: mcp}
  - {id: learn-mcp, label: "Microsoft Learn MCP", sublabel: "Documentation, no tenant", kind: external, state: documented, col: 2, row: 5, summary: "The public Microsoft Learn MCP server used for how-to questions. It needs network access but no tenant or credentials."}
  - {id: changes, label: "Change service", sublabel: "Plan, approve, execute, verify", kind: policy, state: implemented, col: 3, row: 0, component: human-approval, repo_path: src/fabric_foundry_accelerator/services/changes.py, runtime: changes}
  - {id: education, label: "Education service", sublabel: "Lessons, labs, diagrams", kind: service, state: implemented, col: 3, row: 1, repo_path: src/fabric_foundry_accelerator/services/education.py, runtime: education, summary: "Serves validated lessons, labs, the architecture views and the completeness gate. Knowledge-check answers stay on the server."}
  - {id: evaluation, label: "Evaluation service", sublabel: "Measures vs baseline", kind: evidence, state: implemented, col: 3, row: 2, component: evaluation, repo_path: src/fabric_foundry_accelerator/services/evaluation.py, runtime: evaluation}
  - {id: router, label: "Provider router", sublabel: "Timeouts, retries, breaker", kind: service, state: implemented, col: 3, row: 3, component: provider-router, repo_path: src/fabric_foundry_accelerator/fallback/router.py, runtime: router}
  - {id: policies, icon: general/Workflow, label: "Policies and overlay", sublabel: "config/", kind: policy, state: implemented, col: 4, row: 0, component: policy-engine, repo_path: config/policies}
  - {id: content, icon: general/Folder_Blank, label: "Learning content", sublabel: "education/ and guides/", kind: knowledge, state: implemented, col: 4, row: 1, repo_path: education, summary: "Lessons, labs, architecture views, the pattern catalog and Use-Case Guides as validated YAML and Markdown."}
  - {id: audit, icon: general/File, label: "Audit log", sublabel: "data/runtime/audit.jsonl", kind: evidence, state: implemented, col: 4, row: 2, component: audit-store, repo_path: src/fabric_foundry_accelerator/audit/store.py, runtime: audit}
  - {id: local-provider, label: "Local Fabric provider", sublabel: "DuckDB over Parquet", kind: local, state: implemented, col: 4, row: 3, component: local-fabric-provider, repo_path: src/fabric_foundry_accelerator/providers/fabric/local.py, runtime: fabric-local}
