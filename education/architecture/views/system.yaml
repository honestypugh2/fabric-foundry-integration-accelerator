  - {id: fabric-live, label: "Fabric REST and MCP", sublabel: "Live, read-only first", repo_path: src/fabric_foundry_accelerator/providers/fabric/live.py, kind: fabric, state: tenant-validation, col: 6, row: 3, component: fabric-mcp, runtime: fabric-live}
