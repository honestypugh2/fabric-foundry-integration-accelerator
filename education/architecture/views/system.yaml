traces:
  - id: guide-rehearsal
    title: Rehearse a guide write
    summary: The HC-01 guide runner rehearses a governed write against the simulated workspace.
    label: SIMULATED
    demo_act: 5
    steps:
      - {node: web-app, say: "In the guide runner you press Plan and validate.", note: "The browser only shows what the backend decides."}
      - {node: vite-proxy, edge: app-to-proxy, say: "The request goes to /api on the same origin."}
      - {node: api, edge: proxy-to-api, say: "The control plane assigns a correlation ID and calls the change service."}
      - {node: changes, edge: api-to-changes, say: "The change service records the plan and checks for duplicates."}
      - {node: policies, edge: changes-to-policies, say: "Policy decides whether the operation, item type and workspace alias are allowed."}
      - {node: changes, say: "After a different person approves, the scoped writer executes in the simulated workspace and verifies.", note: "Labeled SIMULATED. No Fabric item is created."}
      - {node: audit, say: "Plan, approvals (including refused ones) and execution are audited under one correlation ID."}
  - id: fallback-read
    title: Read with fallback
    summary: A read goes through the router; when the live provider fails, the approved LOCAL equivalent answers, visibly labeled.
    label: LOCAL
    demo_act: 7
    steps:
      - {node: web-app, say: "The data explorer asks for the lakehouse tables."}
      - {node: api, say: "The control plane sends a typed read to the router."}
      - {node: router, edge: api-to-router, say: "The router tries the live provider with a timeout and bounded retries.", note: "Offline there is no live provider, so it goes straight to LOCAL."}
      - {node: fabric-live, edge: router-to-live, say: "The live call fails or the breaker is open (simulated outage in training)."}
      - {node: local-provider, edge: router-to-local, say: "The approved LOCAL equivalent answers. The result is labeled LOCAL in HYBRID mode with a fallback reason."}
      - {node: synthetic-data, edge: local-to-data, say: "Data comes from synthetic Parquet built by ffia data build."}
  - id: agent-plan
    title: A coding agent proposes a plan
    summary: GitHub Copilot or Claude Code calls ffia-local over MCP. It can read and propose, but never approve or execute.
    label: LOCAL
    demo_act: 3
    steps:
      - {node: coding-agent, say: "You ask the coding agent to propose a lakehouse change."}
      - {node: mcp-config, edge: agent-to-config, say: "The harness reads .mcp.json and starts ffia-local."}
      - {node: ffia-local, edge: config-to-ffia, say: "It calls generate_fabric_change_plan. There is no approve or execute tool.", note: "MCP access is not authority."}
      - {node: router, edge: ffia-to-router, say: "Read tools such as preview_table go through the same router, labeled LOCAL."}
      - {node: audit, say: "Every tool call is rate limited and audited."}
