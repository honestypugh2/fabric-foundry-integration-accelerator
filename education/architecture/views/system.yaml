  - {id: agents, label: "Agent service", sublabel: "Router, LOCAL agent, eval, workflow", kind: service, state: implemented, col: 5, row: 1, repo_path: src/fabric_foundry_accelerator/agents, runtime: agents, summary: "Asks the sales agent through the provider router: the deterministic LOCAL agent offline, the live Foundry agent when opted in. Also runs the agent evaluation suite and the Agent Framework monthly-insights workflow (drafts only; nothing is sent)."}
