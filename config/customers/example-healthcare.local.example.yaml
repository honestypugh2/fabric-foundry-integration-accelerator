# Copy to example-healthcare.local.yaml (git-ignored) and fill in your own demo-tenant values.
# Never commit real tenant, workspace or item identifiers. The placeholders below are not GUIDs,
# so this example file is never loaded by accident.
tenant_id: <TENANT_ID>
workspaces:
  demo-dev:
    workspace_id: <DEV_WORKSPACE_ID>
    semantic_models:
      hc-lab-7file-v1: <SEMANTIC_MODEL_ID>
foundry:                      # optional; checked by `ffia foundry readiness`
  subscription_id: <SUBSCRIPTION_ID>
  resource_group: <RESOURCE_GROUP>
  account: <FOUNDRY_RESOURCE_NAME>
  project: <FOUNDRY_PROJECT_NAME>
  model_deployments: [<MODEL_DEPLOYMENT_NAME>]
  agents: [sales-insights-agent]
  fabric_connection: <FABRIC_CONNECTION_NAME>
