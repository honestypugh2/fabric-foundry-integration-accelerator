# Pinned, curated third-party agent skills. `ffia skills install` downloads exactly this archive,
# verifies its SHA-256, and extracts only the listed skills and support folders into git-ignored
# paths under .claude/ (the project skill folder VS Code Copilot and Claude Code both read).
#
# Hardening (why this is not the upstream install):
# - pinned release tag and archive hash, never `main` or @latest;
# - a curated subset for the HC-01 medallion lab, not all 25 skills;
# - the bundle's .mcp.json is never installed: it grants `tools: ["*"]` and runs
#   @microsoft/powerbi-modeling-mcp@latest. Use `ffia mcp render <profile>` instead;
# - skills drive `az rest` calls (including POST and DELETE) outside MCP, so .vscode/settings.json
#   and .claude/settings.json require approval for every `az rest` command.
