# MCP tool manifest for the local educational server. MCP standardizes capability access; it does
# NOT grant authority. There are deliberately no approve or execute tools: approval is a human
# action through the API/UI, recorded in the audit log.
version: 1
server:
  name: ffia-local
  description: 'Local educational MCP server. Exposes typed, allow-listed tools only: no shell, SQL, filesystem,
    URL fetch or REST proxy.'
  identity: Local process. Holds no cloud credentials.
tools:
- name: get_demo_capabilities
  description: Summarize what the accelerator can demonstrate and how each capability is labeled.
  owner: accelerator-maintainers
  version: 1.0.0
  classification: public-synthetic
  identity: local-process (no cloud identity)
  allowed_operations:
  - read
  read_only: true
  rate_limit_per_minute: 60
  timeout_seconds: 15
  audit: true
  enabled: true
  failure_policy: return-error-no-fallback-for-writes
  revocation: 'Set enabled: false in config/policies/tools.yaml and restart the server.'
- name: get_runtime_status
  description: Report operating mode, providers, preview flags, write mode and circuit-breaker state.
  owner: accelerator-maintainers
  version: 1.0.0
  classification: public-synthetic
  identity: local-process (no cloud identity)
  allowed_operations:
