  read_only: true
  rate_limit_per_minute: 60
  timeout_seconds: 15
  audit: true
  enabled: true
  failure_policy: return-error-no-fallback-for-writes
  revocation: 'Set enabled: false in config/policies/tools.yaml and restart the server.'
- name: get_architecture_pattern
  description: Return one Fabric + Foundry architecture pattern by ID (P01-P24).
  owner: accelerator-maintainers
