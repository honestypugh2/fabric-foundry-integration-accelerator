# MCP profiles: the single source for every MCP client configuration in this repository.
#
# MCP standardizes capability access; it does not grant authority. Each profile is the narrowest
# tool set for one job. Render a profile for a client with `ffia mcp render <profile> --client X`;
# `ffia mcp check` validates pins, allow-lists and safety rules (it runs in `make validate`).
#
# External servers are pinned to exact stable versions. Write-capable tools never appear in a
# read-only profile, and tools that run arbitrary queries or copy data out are excluded everywhere
# except where a profile explicitly documents why.
schema_version: 1

servers:
  microsoft-learn:
    transport: http
    url: https://learn.microsoft.com/api/mcp
    description: Public Microsoft Learn documentation search (no tenant access).
  ffia-local:
    transport: stdio
    command: uv
    args: [run, --frozen, ffia, serve, mcp]
    description: This repository's typed, allow-listed educational MCP server (offline).
  fabric-mcp:
    transport: stdio
    package: "@microsoft/fabric-mcp"
    version: "1.4.0"
    args: [server, start]
    catalog: catalog/fabric-mcp-1.4.0.yaml
    status: GA
    description: >-
      Microsoft Fabric MCP server (local). Docs tools run offline; OneLake, Core and Data Factory
      tools call the tenant as the signed-in user.
  powerbi-modeling-mcp:
    transport: stdio
    package: "@microsoft/powerbi-modeling-mcp"
    version: "1.0.0"
    args: [--start]
    description: >-
      Power BI Modeling (authoring) MCP server (local). It has no read-only switch, so it is used
      only against local PBIP/TMDL sandbox copies. A person accepts its EULA; configs never do.

# Tools excluded from read-only profiles even when the server marks them read-only.
never_read_only:
  - name: datafactory_execute-query
    reason: runs arbitrary M (Power Query) queries; the repository never exposes arbitrary query tools
  - name: onelake_download-file
    reason: copies lakehouse data out of OneLake; read-only profiles stay at metadata

profiles:
  fabric-first:
    title: Fabric MCP first, local fallback (default)
    purpose: >-
      The repository default for GitHub Copilot and Claude Code. Real Fabric MCP read-only tools
      answer "what is" from the signed-in tenant (metadata only, no writes, no data download, no
      queries). When Fabric MCP is unavailable (not signed in, no capacity, server down), the agent
      says so and uses the named ffia-local equivalent, labeled LOCAL. Writes are never here.
    execution_label: LIVE
    default: true
    fallback: ffia-local
    requires: [az login --tenant <demo tenant> for LIVE answers; nothing for the LOCAL fallback]
    servers:
      microsoft-learn: {}
      fabric-mcp:
        read_only: true
        tools:
          - docs_item-definitions
          - docs_best-practices
          - core_search-catalog
          - onelake_list-workspaces
          - onelake_list-items
          - onelake_list-files
          - onelake_list-tables
          - onelake_get-table
      ffia-local: {}

  offline:
    title: Offline teaching (no tenant)
    purpose: Documentation plus this repository's local MCP server; no tenant, no Fabric MCP.
    execution_label: LOCAL
    fallback: ffia-local
    servers:
      microsoft-learn: {}
      ffia-local: {}

  fabric-docs:
    title: Fabric MCP — docs only ("how")
    purpose: >-
      Fabric API specs, item-definition schemas, examples and best practices. Runs locally and never
      connects to a Fabric environment.
    execution_label: LOCAL
    servers:
      microsoft-learn: {}
      fabric-mcp:
        read_only: true
        tools:
          - docs_list-item-types
          - docs_item-api-spec
          - docs_platform-api-spec
          - docs_item-definitions
          - docs_best-practices
          - docs_api-examples

  fabric-readonly:
    title: Fabric MCP — tenant metadata, read-only ("what is")
    purpose: >-
      Discover workspaces, items, tables, shortcuts and pipelines in the signed-in user's tenant.
      Metadata only: no data download, no query execution, no writes.
    execution_label: LIVE
    requires: [az login --tenant <demo tenant>, Fabric license and capacity (ffia fabric readiness)]
    servers:
      fabric-mcp:
        read_only: true
        tools:
          - docs_item-definitions
          - docs_best-practices
          - core_search-catalog
          - onelake_list-workspaces
          - onelake_list-items
          - onelake_list-files
          - onelake_get-table-config
          - onelake_list-table-namespaces
          - onelake_get-table-namespace
          - onelake_list-tables
          - onelake_get-table
          - onelake_list-shortcuts
          - onelake_get-shortcut
          - datafactory_list-pipelines
          - datafactory_get-pipeline
          - datafactory_list-dataflows

  fabric-authoring-gated:
    title: Fabric MCP — create item, approval-gated ("change it")
    purpose: >-
      Teaches why an MCP write tool is not authority. Exposes exactly one additive tool. The
      client must ask a person before every call; prefer the repository's PLAN → APPROVE → EXECUTE
      change flow, which re-checks duplicates and audits.
    execution_label: LIVE
    approval: per-call
    requires: [dedicated dev workspace, explicit human approval for each call]
    servers:
      fabric-mcp:
        read_only: false
        tools:
          - core_search-catalog
          - core_create-item

  powerbi-modeling-sandbox:
    title: Power BI Modeling MCP — local PBIP sandbox
    purpose: >-
      Author a copy of the synthetic semantic model in local PBIP/TMDL files, review the diff in
      Git, then publish through the approved change flow. Never pointed at a shared workspace.
    execution_label: LOCAL
    approval: per-call
    requires: [a person accepts the Power BI Modeling MCP EULA, a local PBIP copy under a sandbox folder]
    servers:
      powerbi-modeling-mcp:
        read_only: false

  hc01-lab:
    title: HC-01 lab — Fabric MCP for the live medallion lab (approval-gated)
    purpose: >-
      The exact Fabric MCP tools HC-01 steps 02-05 name: find the workspace, list items and files,
      create the lakehouse and Files/raw, upload the seven synthetic CSVs. Use only against a
      dedicated dev workspace. Every write needs a person to approve the call.
    execution_label: LIVE
    approval: per-call
    requires: [dedicated dev workspace, explicit human approval for each write call, the guide's duplicate and empty-folder checks]
    # Reads fall back to ffia-local (labeled LOCAL); a failed write stops and is never redirected.
    fallback: ffia-local
    servers:
      fabric-mcp:
        read_only: false
        tools:
          - docs_item-definitions
          - core_search-catalog
          - onelake_list-items
          - onelake_list-files
          - core_create-item
          - onelake_create-directory
          - onelake_upload-file
        allow_destructive:
          - tool: onelake_upload-file
            reason: >-
              Marked destructive because it can overwrite a file. HC-01 step 05 lists Files/raw first,
              stops if it is not empty, and uploads with overwrite set to false.
      ffia-local: {}

# Committed client configurations that must equal a rendered profile (checked by `ffia mcp check`).
rendered_files:
  - path: guides/hc-01-fabric-mcp-powerbi-medallion-lab/.mcp.json
    profile: hc01-lab
    client: claude
